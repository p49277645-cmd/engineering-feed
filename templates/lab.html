<style id="lab">
:root{
  --cobalt:#1D4ED8; --sig:#FF6A00; --pipe:#F5C400; --cu:#B87333;
  --ok:#35F06A; --warn:#FFB020; --danger:#FF3B30; --info:#4CC3FF;
  --t1:#E8EDF2; --t2:#9AA7B4;
  --bg:#0D1117; --card:#23282E; --deep:#0B0D10; --steel:#3A4149;
  --steelg:linear-gradient(180deg,#4A525B 0%,#3A4149 38%,#2C333B 72%,#23282E 100%);
  --brush:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px);
  --bolts:radial-gradient(circle 3.5px at 12px 12px,#9AA7B4 0 1.8px,#0B0D10 1.8px 3.4px,transparent 3.4px),
          radial-gradient(circle 3.5px at calc(100% - 12px) 12px,#9AA7B4 0 1.8px,#0B0D10 1.8px 3.4px,transparent 3.4px),
          radial-gradient(circle 3.5px at 12px calc(100% - 12px),#9AA7B4 0 1.8px,#0B0D10 1.8px 3.4px,transparent 3.4px),
          radial-gradient(circle 3.5px at calc(100% - 12px) calc(100% - 12px),#9AA7B4 0 1.8px,#0B0D10 1.8px 3.4px,transparent 3.4px);
  --font-h:'Russo One',sans-serif; --font-m:'JetBrains Mono',monospace; --font-b:'Inter',sans-serif;
}
body{background:var(--bg);color:var(--t1);font-family:var(--font-b);}
::-webkit-scrollbar{width:12px;}
::-webkit-scrollbar-track{background:#14171B;}
::-webkit-scrollbar-thumb{background:var(--sig);border:2px solid var(--deep);border-radius:2px;}

/* ЗАЛ — статичная SVG-картинка, никаких скриптов */
#lab-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
#lab-bg svg{position:absolute;inset:0;width:100%;height:100%;}

/* шапка */
.topbar{background:var(--steelg);background-image:var(--bolts),var(--brush);box-shadow:0 8px 22px rgba(0,0,0,.6);}
.logo{font-family:var(--font-h);text-transform:uppercase;letter-spacing:.06em;font-size:21px;color:var(--t1);
  background:linear-gradient(180deg,#4A525B,#2C333B);border:1px solid var(--deep);padding:8px 14px;border-radius:3px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 3px 0 var(--deep);}
.searchwrap input{font-family:var(--font-m);background:var(--deep);border:1px solid var(--deep);color:#CFD8E3;padding:8px 12px;border-radius:3px;
  box-shadow:inset 0 4px 10px rgba(0,0,0,.8);}
.iconbtn,.avatar{background:linear-gradient(180deg,#4A525B 0%,#3A4149 40%,#2C333B 100%);border:1px solid var(--deep);border-radius:4px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 3px 0 var(--deep);color:var(--t2);}
.avatar-nick{font-family:var(--font-m);color:var(--sig);background:#14171B;border:1px solid var(--sig);padding:3px 8px;border-radius:2px;}

/* сайдбар */
.sidebar{background-color:#171C22;background-image:var(--bolts),var(--brush),linear-gradient(180deg,#23282E,#171C22);
  border:2px solid var(--deep);outline:1px solid var(--steel);outline-offset:-4px;border-radius:5px;padding-bottom:20px;
  box-shadow:0 18px 44px rgba(0,0,0,.78);}
.side-label{font-family:var(--font-h);font-size:10.5px;letter-spacing:.12em;color:var(--pipe);
  background:var(--deep);border-left:4px solid var(--pipe);padding:4px 8px;display:inline-block;border-radius:2px;}
.side-item{font-family:var(--font-b);font-size:13px;font-weight:600;background-color:#2C333B;
  background-image:linear-gradient(180deg,#4A525B 0%,#3A4149 40%,#2C333B 100%);
  border:1px solid var(--deep);border-radius:3px;margin-bottom:8px;padding-left:34px;position:relative;color:var(--t2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 0 var(--deep);}
.side-item::before{content:'';position:absolute;left:12px;top:50%;transform:translateY(-50%);width:7px;height:7px;border-radius:50%;
  background:#14171B;box-shadow:inset 0 0 0 1px var(--deep);}
.side-item.active{background-color:var(--sig);background-image:linear-gradient(180deg,#FF9A4D 0%,#FF6A00 55%,#C24E00 100%);
  color:#14171B;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 3px 0 var(--deep),0 0 18px rgba(255,106,0,.55);}
.cat-card{background-color:#2C333B;background-image:linear-gradient(180deg,#4A525B 0%,#3A4149 40%,#2C333B 100%);
  border:1px solid var(--deep);border-radius:3px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 0 var(--deep);}
.cat-letter{font-family:var(--font-h);border-radius:50%;background:var(--deep);border:2px solid var(--c);color:var(--c);}
.course-card{background:#1A1F26;border:1px solid var(--deep);border-left:4px solid var(--pipe);border-radius:3px;}

/* главная */
.main-head h1{font-family:var(--font-h);text-transform:uppercase;letter-spacing:.06em;font-size:21px;color:var(--t1);
  background:linear-gradient(180deg,#3A4149,#23282E);border:1px solid var(--deep);border-radius:3px;padding:9px 16px;display:inline-block;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 3px 0 var(--deep);}
.pill{font-family:var(--font-m);font-size:12px;background:linear-gradient(180deg,#4A525B 0%,#3A4149 40%,#2C333B 100%);
  border:1px solid var(--deep);border-radius:3px;padding:0 18px;color:var(--t2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 3px 0 var(--deep);}
.pill.active{background-color:var(--sig);background-image:linear-gradient(180deg,#FF9A4D 0%,#FF6A00 55%,#C24E00 100%);
  color:#14171B;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 3px 0 var(--deep),0 0 18px rgba(255,106,0,.55);}
.empty-state{background-color:#161B22;background-image:var(--bolts),var(--brush),linear-gradient(180deg,#232B36,#141920);
  border:2px solid var(--deep);border-top:6px solid var(--cu);outline:1px solid var(--steel);outline-offset:-5px;border-radius:6px;
  padding:56px 24px;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.1);}
.empty-state p:first-child{font-family:var(--font-h);text-transform:uppercase;letter-spacing:.08em;font-size:19px;color:var(--t1);}
.empty-state p:nth-child(2){color:var(--t2);font-size:12px;}

/* карточки */
.card{background-color:var(--card);background-image:var(--bolts),var(--brush),var(--steelg);
  border:1px solid var(--deep);border-radius:4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 12px 30px rgba(0,0,0,.7);}
.card-title{font-family:var(--font-h);font-weight:400;text-transform:uppercase;letter-spacing:.02em;font-size:15px;line-height:1.35;}
.src{font-family:var(--font-m);font-size:10.5px;color:var(--t2);background:linear-gradient(180deg,#4A525B,#2C333B);
  border:1px solid var(--deep);border-radius:2px;padding:3px 8px;display:inline-block;}
.act{background:linear-gradient(180deg,#4A525B 0%,#3A4149 40%,#2C333B 100%);border:1px solid var(--deep);border-radius:3px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 2px 0 var(--deep);}

/* модалки */
.int-overlay,.auth-overlay,.cj-overlay{backdrop-filter:none;background:rgba(6,8,10,.9);}
.int-box,.auth-box,.cj-box{background-color:var(--card);background-image:var(--bolts),var(--brush),var(--steelg);
  border:1px solid var(--deep);border-top:8px solid var(--sig);border-radius:6px;
  box-shadow:0 30px 70px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.12);}
.int-tab,.auth-tab{font-family:var(--font-m);background:linear-gradient(180deg,#4A525B 0%,#3A4149 40%,#2C333B 100%);
  border:1px solid var(--deep);border-radius:3px;color:var(--t2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 3px 0 var(--deep);}
.int-tab.active,.auth-tab.active{background-color:var(--sig);background-image:linear-gradient(180deg,#FF9A4D 0%,#FF6A00 55%,#C24E00 100%);
  color:#14171B;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 3px 0 var(--deep),0 0 18px rgba(255,106,0,.55);}
.int-search input,.auth-field input{font-family:var(--font-m);background:var(--deep);border:1px solid var(--deep);border-radius:3px;color:var(--t1);
  box-shadow:inset 0 4px 10px rgba(0,0,0,.8);}
input:-webkit-autofill{-webkit-box-shadow:0 0 0 1000px var(--deep) inset;-webkit-text-fill-color:var(--t1);}

/* латунь */
.empty-state button,.int-save,.auth-submit,.int-search button,#crsFind,#editInterestsBtn,#saveSettingsBtn{
  position:relative;font-family:var(--font-h);text-transform:uppercase;letter-spacing:.06em;font-size:13px;
  background-color:var(--cu);background-image:linear-gradient(180deg,#E8B06B 0%,#B87333 52%,#7E4A1D 100%);
  color:#201205;border:1px solid var(--deep);border-radius:5px;padding:12px 34px;
  box-shadow:0 0 0 2px var(--deep),0 6px 0 var(--deep),inset 0 2px 0 rgba(255,255,255,.5),0 0 24px rgba(184,115,51,.45);}
.int-ghost{font-family:var(--font-m);background-color:#2C333B;background-image:linear-gradient(180deg,#4A525B,#2C333B);
  color:#CFD8E3;border:1px solid var(--deep);border-radius:5px;
  box-shadow:0 0 0 2px var(--deep),0 4px 0 var(--deep),inset 0 1px 0 rgba(255,255,255,.25);}

/* настройки */
.info-row{background:none;border-bottom:1px solid #23282E;padding:14px 2px;font-size:12px;}
.info-row span:last-child{font-family:var(--font-m);color:var(--t1);background:var(--deep);border:1px solid #23282E;border-radius:3px;padding:4px 10px;font-size:13px;}
.btn-danger{font-family:var(--font-m);background:#14171B;border:2px solid var(--danger);color:var(--danger);border-radius:3px;
  box-shadow:inset 0 0 0 1px var(--deep),0 0 14px rgba(255,59,48,.35);}

/* адаптив */
@media(max-width:1024px){.shell{grid-template-columns:1fr;gap:16px;padding:16px;}}
@media(max-width:767px){
  html,body{overflow-x:hidden;max-width:100%;}
  .topbar{flex-wrap:nowrap;gap:6px;padding:7px 10px;min-height:52px;}
  .logo{font-size:13px;padding:5px 8px;flex:0 0 auto;}
  .searchwrap{flex:1 1 0;min-width:0;}
  .iconbtn,.avatar{flex:0 0 36px;width:36px;height:36px;}
  .main-head h1{font-size:16px;padding:8px 12px;}
  .pill{height:40px;padding:0 14px;}
  .empty-state{padding:36px 16px;width:100%;}
  .empty-state button{width:100%;padding:14px 10px;}
  .card{padding:16px;}
  .card-title{font-size:14px;}
  .int-box,.auth-box,.cj-box{height:auto;max-height:92dvh;width:100%;border-radius:0;border-top-width:6px;}
}
</style>
