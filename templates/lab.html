<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style id="lab-theme">
:root{
  --cobalt:#1D4ED8; --cobalt-d:#12308F; --sig:#FF6A00; --pipe:#F5C400;
  --steel-l:#8A939E; --steel:#3A4149; --iron:#23282E; --concrete:#B9B4A8; --concrete-d:#14171B;
  --cab-r:#E23B2E; --cab-b:#2E7BE2; --cab-k:#0B0D10; --cu:#B87333;
  --ok:#35F06A; --warn:#FFB020; --danger:#FF3B30; --info:#4CC3FF;
  --t1:#E8EDF2; --t2:#9AA7B4;
  --bg:#0D1117; --panel:#1A1F26; --card:#23282E; --card2:#2C333B; --border:#3A4149;
  --accent-sand:var(--sig); --accent-emerald:var(--info); --accent-rust:var(--pipe); --accent-coral:var(--danger);
  --steelg:linear-gradient(180deg,#4A525B 0%,#3A4149 38%,#2C333B 72%,#23282E 100%);
  --brush:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px);
  --hazard:repeating-linear-gradient(45deg,var(--sig) 0 12px,#14171B 12px 24px);
  --rib:repeating-linear-gradient(45deg,rgba(0,0,0,.35) 0 3px,transparent 3px 6px);
  --bolts:radial-gradient(circle 3.5px at 12px 12px,#9AA7B4 0 1.8px,#0B0D10 1.8px 3.4px,transparent 3.4px),
          radial-gradient(circle 3.5px at calc(100% - 12px) 12px,#9AA7B4 0 1.8px,#0B0D10 1.8px 3.4px,transparent 3.4px),
          radial-gradient(circle 3.5px at 12px calc(100% - 12px),#9AA7B4 0 1.8px,#0B0D10 1.8px 3.4px,transparent 3.4px),
          radial-gradient(circle 3.5px at calc(100% - 12px) calc(100% - 12px),#9AA7B4 0 1.8px,#0B0D10 1.8px 3.4px,transparent 3.4px);
  --font-h:'Russo One',sans-serif; --font-m:'JetBrains Mono',monospace; --font-b:'Inter',sans-serif;
}
html{scrollbar-color:var(--sig) #14171B;}
body{background:var(--bg)!important;color:var(--t1)!important;font-family:var(--font-b)!important;}
body.lab-dim #lab-canvas,body.lab-dim #lab-2d{filter:blur(6px) brightness(.45);}
#lab-canvas,#lab-2d{transition:filter .35s ease;}
::-webkit-scrollbar{width:12px;}
::-webkit-scrollbar-track{background:linear-gradient(180deg,#14171B,#1A1F26);border-left:1px solid #0B0D10;}
::-webkit-scrollbar-thumb{background:var(--sig) var(--rib);border:2px solid #0B0D10;border-radius:2px;}
::-webkit-scrollbar-thumb:hover{background:var(--pipe) var(--rib);}
#lab-bg{position:fixed;inset:0;z-index:0;pointer-events:none;}
#lab-canvas{width:100%;height:100%;display:block;}
#lab-2d{position:absolute;inset:0;overflow:hidden;}
#lab-2d svg{position:absolute;inset:0;width:100%;height:100%;}
#lab-cables{position:fixed;inset:0;z-index:250;pointer-events:none;}
.topbar,.shell,.int-overlay,.auth-overlay,.cj-overlay,.sidebar-overlay{position:relative;}
.topbar{z-index:50;}
/* ШАПКА = балка пульта */
.topbar{background:var(--steelg)!important;background-image:var(--bolts),var(--brush)!important;border-bottom:none!important;box-shadow:0 8px 22px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.14)!important;}
.topbar::after{content:'';position:absolute;left:0;right:0;bottom:-7px;height:7px;background:var(--hazard);box-shadow:0 2px 6px rgba(0,0,0,.6);pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,#000 0 12%,rgba(0,0,0,.55) 13% 14%,#000 15% 62%,rgba(0,0,0,.5) 63% 64%,#000 65%);mask-image:linear-gradient(90deg,#000 0 12%,rgba(0,0,0,.55) 13% 14%,#000 15% 62%,rgba(0,0,0,.5) 63% 64%,#000 65%);}
.logo{font-family:var(--font-h)!important;text-transform:uppercase;letter-spacing:.08em;color:var(--t1)!important;
  background:linear-gradient(180deg,#4A525B,#2C333B)!important;border:1px solid #0B0D10!important;border-radius:3px!important;
  padding:8px 14px!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -2px 0 rgba(0,0,0,.5),0 3px 0 #0B0D10!important;
  text-shadow:0 1px 0 rgba(255,255,255,.18),0 -1px 0 rgba(0,0,0,.7)!important;}
.logo::after{content:none!important;animation:none!important;}
.searchwrap input{font-family:var(--font-m)!important;background:#0B0D10!important;border:1px solid #0B0D10!important;border-radius:3px!important;
  box-shadow:inset 0 4px 10px rgba(0,0,0,.8),inset 0 0 0 1px #3A4149!important;color:var(--ok)!important;caret-color:var(--ok)!important;}
.searchwrap input::placeholder{color:#5C6874!important;}
.kbd{font-family:var(--font-m)!important;background:linear-gradient(180deg,#4A525B,#2C333B)!important;border:1px solid #0B0D10!important;border-radius:4px!important;
  box-shadow:0 2px 0 #0B0D10,inset 0 1px 0 rgba(255,255,255,.25)!important;color:var(--t1)!important;}
.iconbtn,.avatar{background:var(--steelg)!important;border:1px solid #0B0D10!important;border-radius:4px!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 3px 0 #0B0D10!important;color:var(--t2)!important;}
.iconbtn:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 3px 0 #0B0D10,0 0 12px rgba(255,176,32,.35)!important;color:var(--warn)!important;}
.iconbtn:active,.avatar:active{transform:translateY(2px)!important;box-shadow:inset 0 3px 8px rgba(0,0,0,.7)!important;}
.iconbtn::after{content:'';position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:#3A4149;pointer-events:none;}
#bellBtn::after{background:var(--ok);box-shadow:0 0 7px var(--ok);}
#refreshBtn.lab-spin::after{background:var(--warn);box-shadow:0 0 7px var(--warn);}
.avatar{border:1px solid #0B0D10!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 3px 0 #0B0D10!important;}
.avatar .online{background:var(--ok)!important;box-shadow:0 0 6px var(--ok)!important;}
.avatar-nick{font-family:var(--font-m)!important;color:var(--sig)!important;background:#14171B;border:1px solid var(--sig);border-radius:2px;padding:3px 8px;
  box-shadow:0 0 8px rgba(255,106,0,.35);}
/* САЙДБАР = стойка 19" */
.sidebar{background:var(--steelg)!important;background-image:var(--bolts),var(--brush)!important;border:1px solid #0B0D10!important;border-radius:5px!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 14px 34px rgba(0,0,0,.6)!important;}
.sidebar::after{content:'';position:absolute;left:10px;right:10px;bottom:52px;height:26px;background:var(--hazard);border:1px solid #0B0D10;border-radius:2px;opacity:.85;pointer-events:none;}
.side-label{font-family:var(--font-h)!important;font-size:10px!important;letter-spacing:.14em!important;color:var(--pipe)!important;
  background:#0B0D10;border-left:4px solid var(--pipe);padding:4px 8px!important;display:inline-block;border-radius:2px;}
.side-item{font-family:var(--font-b)!important;background:linear-gradient(180deg,#3A4149,#2C333B)!important;background-image:var(--bolts)!important;
  border:1px solid #0B0D10!important;border-radius:3px!important;margin-bottom:7px!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 0 #0B0D10!important;
  color:var(--t2)!important;position:relative;padding-left:34px!important;}
.side-item::before{content:'';position:absolute;left:12px;top:50%;transform:translateY(-50%);width:7px;height:7px;border-radius:50%;
  background:#14171B;box-shadow:inset 0 0 0 1px #0B0D10;pointer-events:none;}
.side-item:hover{background:linear-gradient(180deg,#4A525B,#3A4149)!important;color:var(--warn)!important;}
.side-item:hover::before{background:var(--warn);box-shadow:0 0 8px var(--warn);}
.side-item.active{background:linear-gradient(180deg,#2E7BE2,var(--cobalt-d))!important;color:var(--t1)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 0 #0B0D10,0 0 16px rgba(29,78,216,.55)!important;}
.side-item.active::before{background:var(--ok);box-shadow:0 0 9px var(--ok);}
.side-item:active{transform:translateY(2px);box-shadow:inset 0 3px 8px rgba(0,0,0,.7)!important;}
.cat-card{background:linear-gradient(180deg,#3A4149,#23282E)!important;background-image:var(--bolts)!important;border:1px solid #0B0D10!important;border-radius:3px!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 0 #0B0D10!important;}
.cat-card::before{background:var(--c)!important;height:4px!important;box-shadow:0 0 8px var(--c)!important;}
.cat-letter{font-family:var(--font-h)!important;border-radius:50%!important;background:#0B0D10!important;border:2px solid var(--c)!important;color:var(--c)!important;
  box-shadow:0 0 10px color-mix(in srgb,var(--c) 60%,transparent),inset 0 0 6px rgba(0,0,0,.8)!important;}
.cat-name{font-family:var(--font-b)!important;font-weight:600!important;}
.course-card{background:#1A1F26!important;border:1px solid #0B0D10!important;border-left:4px solid var(--pipe)!important;border-radius:3px!important;}
.course-star{color:var(--pipe)!important;text-shadow:0 0 8px rgba(245,196,0,.6)!important;}
.manage{position:relative;z-index:2;color:var(--t1)!important;background:rgba(11,13,16,.82)!important;border:1px solid #3A4149!important;border-radius:3px!important;
  font-family:var(--font-m)!important;margin-top:44px!important;}
.manage:hover{color:var(--sig)!important;border-color:var(--sig)!important;}
/* ГЛАВНАЯ */
.main-head{border-bottom:none!important;position:relative;padding-bottom:20px!important;}
.main-head::after{content:'';position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--hazard);border-radius:1px;pointer-events:none;}
.main-head h1{font-family:var(--font-h)!important;text-transform:uppercase;letter-spacing:.08em!important;color:var(--t1)!important;
  background:linear-gradient(180deg,#3A4149,#23282E);border:1px solid #0B0D10;border-radius:3px;padding:10px 18px;display:inline-block;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 3px 0 #0B0D10;text-shadow:0 1px 0 rgba(255,255,255,.15),0 -1px 0 rgba(0,0,0,.7);}
.main-head h1::before,.int-box h2::before,.cj-head h2::before,.auth-box h2::before,.chat-header h1::before{content:'● '!important;color:var(--sig)!important;text-shadow:0 0 10px var(--sig)!important;}
.pill{font-family:var(--font-m)!important;background:var(--steelg)!important;border:1px solid #0B0D10!important;border-radius:3px!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 3px 0 #0B0D10!important;color:var(--t2)!important;clip-path:none!important;position:relative;padding-left:34px!important;}
.pill::before{content:'';position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:8px;border-radius:2px;background:#14171B;box-shadow:inset 0 0 0 1px #0B0D10;pointer-events:none;}
.pill::after{content:'';position:absolute;left:12px;top:50%;margin-top:-3px;width:6px;height:6px;border-radius:50%;background:#3A4149;pointer-events:none;}
.pill.active{background:linear-gradient(180deg,#FF8A33,var(--sig))!important;color:#14171B!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 0 #0B0D10,0 0 16px rgba(255,106,0,.5)!important;}
.pill.active::after{left:20px;background:#14171B;box-shadow:0 0 6px rgba(0,0,0,.6);}
.pill:active{transform:translateY(2px);box-shadow:inset 0 3px 8px rgba(0,0,0,.6)!important;}
.empty-state{background:linear-gradient(180deg,#2C333B,#1A1F26)!important;background-image:var(--bolts),var(--brush)!important;border:1px solid #0B0D10!important;border-radius:5px!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 16px 40px rgba(0,0,0,.6)!important;padding:56px 24px!important;position:relative;}
.empty-state p:first-child{font-family:var(--font-h)!important;text-transform:uppercase;letter-spacing:.06em!important;color:var(--t1)!important;}
.empty-state button{font-family:var(--font-h)!important;text-transform:uppercase;letter-spacing:.06em!important;
  background:radial-gradient(120% 120% at 30% 20%,#FF8A33,var(--sig) 60%,#C24E00)!important;color:#14171B!important;border:2px solid #0B0D10!important;border-radius:6px!important;
  box-shadow:0 5px 0 #0B0D10,inset 0 2px 0 rgba(255,255,255,.4),0 0 22px rgba(255,106,0,.45)!important;position:relative;padding:16px 34px!important;}
.empty-state button::after{content:'';position:absolute;inset:-9px -7px auto -7px;height:16px;background:linear-gradient(180deg,rgba(138,147,158,.9),rgba(58,65,73,.9));
  border:1px solid #0B0D10;border-radius:4px;transform-origin:bottom center;transform:rotateX(0deg);transition:transform .25s ease;pointer-events:none;}
.empty-state button:hover::after{transform:rotateX(-58deg);}
.empty-state button:active{transform:translateY(3px);box-shadow:0 2px 0 #0B0D10,inset 0 3px 8px rgba(0,0,0,.5)!important;}
.lab-gauge{width:86px;height:86px;margin:0 10px;vertical-align:middle;}
.lab-gauge .needle{transform-origin:50% 78%;transform:rotate(-52deg);transition:transform 1.1s cubic-bezier(.34,1.4,.4,1);}
.lab-gauge.on .needle{transform:rotate(24deg);}
/* КАРТОЧКИ = приборные модули */
.card{background:var(--steelg)!important;background-image:var(--bolts),var(--brush)!important;border:1px solid #0B0D10!important;border-radius:4px!important;
  clip-path:none!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 10px 26px rgba(0,0,0,.55)!important;}
.card::after{content:attr(data-lab-n);position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:#0B0D10;color:var(--t1);
  border:2px solid var(--c);display:grid;place-items:center;font:700 13px var(--font-m);box-shadow:0 0 10px color-mix(in srgb,var(--c) 55%,transparent);pointer-events:none;}
.card:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 0 0 1px var(--c),0 16px 34px rgba(0,0,0,.65)!important;transform:translateY(-2px)!important;}
.card-meta{font-family:var(--font-m)!important;}
.cat{color:var(--c)!important;background:#0B0D10;border:1px solid var(--c);border-radius:2px;padding:2px 7px;box-shadow:inset 3px 0 0 var(--c);}
.time{font-family:var(--font-m)!important;color:var(--ok)!important;background:#0B0D10;border:1px solid #23282E;border-radius:2px;padding:2px 7px;
  text-shadow:0 0 7px rgba(53,240,106,.7)!important;letter-spacing:.06em;}
.card-title{font-family:var(--font-h)!important;font-weight:400!important;text-transform:uppercase;letter-spacing:.03em!important;font-size:16px!important;}
.card-title a::after{background:var(--sig)!important;}
.src{font-family:var(--font-m)!important;color:var(--t2)!important;background:linear-gradient(180deg,#4A525B,#2C333B);border:1px solid #0B0D10;border-radius:2px;
  padding:3px 8px;display:inline-block;box-shadow:inset 0 1px 0 rgba(255,255,255,.15);text-shadow:0 1px 0 rgba(255,255,255,.12),0 -1px 0 rgba(0,0,0,.7);}
.snippet{color:var(--t2)!important;}
.act{background:var(--steelg)!important;border:1px solid #0B0D10!important;border-radius:3px!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 2px 0 #0B0D10!important;}
.act:active{transform:translateY(2px);box-shadow:inset 0 3px 7px rgba(0,0,0,.7)!important;}
.act.bm.on{background:linear-gradient(180deg,#FFD34D,var(--pipe))!important;color:#14171B!important;box-shadow:0 2px 0 #0B0D10,0 0 12px rgba(245,196,0,.6)!important;}
.readtime{font-family:var(--font-m)!important;color:var(--info)!important;background:#0B0D10!important;border:1px solid #23282E!important;border-radius:2px!important;
  text-shadow:0 0 7px rgba(76,195,255,.7)!important;letter-spacing:.08em;}
.card.read .readtime::before{content:'● ';color:var(--ok);text-shadow:0 0 8px var(--ok);}
.thumb{background:#0B0D10!important;border:1px solid #0B0D10!important;border-radius:3px!important;box-shadow:inset 0 0 0 1px #23282E,inset 0 6px 18px rgba(0,0,0,.8)!important;}
.thumb img{display:none!important;}
.thumb::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='140'%3E%3Cpolyline points='0,70 22,70 30,38 40,102 52,70 78,70 86,52 96,88 108,70 138,70 146,30 156,110 168,70 200,70' fill='none' stroke='%2335F06A' stroke-width='2'/%3E%3C/svg%3E") center/100% 100% no-repeat,
  repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px);}
.thumb-letter{opacity:.14!important;color:var(--c)!important;}
/* МОДАЛКИ = приборные отсеки */
.int-overlay,.auth-overlay,.cj-overlay{backdrop-filter:blur(3px)!important;}
.int-box,.auth-box,.cj-box{background:var(--steelg)!important;background-image:var(--bolts),var(--brush)!important;border:1px solid #0B0D10!important;border-top:8px solid var(--sig)!important;
  border-radius:6px!important;clip-path:none!important;box-shadow:0 30px 70px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.12)!important;}
.int-box h2,.auth-box h2,.cj-head h2{font-family:var(--font-h)!important;text-transform:uppercase;letter-spacing:.06em!important;color:var(--t1)!important;
  text-shadow:0 1px 0 rgba(255,255,255,.15),0 -1px 0 rgba(0,0,0,.7)!important;}
.int-sub,.auth-hint,.int-count{font-family:var(--font-m)!important;color:var(--t2)!important;}
.int-count b{font-family:var(--font-m)!important;font-weight:700!important;color:var(--ok)!important;background:#0B0D10;border:1px solid #23282E;border-radius:2px;padding:1px 6px;
  text-shadow:0 0 8px rgba(53,240,106,.8)!important;}
.int-count b.lab-flick{animation:labflick .3s steps(2) 2;}
@keyframes labflick{50%{opacity:.25;}}
.int-tab,.auth-tab{font-family:var(--font-m)!important;background:var(--steelg)!important;border:1px solid #0B0D10!important;border-radius:3px!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 3px 0 #0B0D10!important;color:var(--t2)!important;position:relative;}
.int-tab.active,.auth-tab.active{background:linear-gradient(180deg,#2E7BE2,var(--cobalt-d))!important;color:var(--t1)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 3px 0 #0B0D10,0 0 16px rgba(29,78,216,.6)!important;}
.int-tab.active::after,.auth-tab.active::after{content:'';position:absolute;top:6px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--sig);box-shadow:0 0 8px var(--sig);}
.int-search input,.auth-field input,#crsQ,#intQ{font-family:var(--font-m)!important;background:#0B0D10!important;border:1px solid #0B0D10!important;border-radius:3px!important;
  box-shadow:inset 0 4px 10px rgba(0,0,0,.8),inset 0 0 0 1px #3A4149!important;color:var(--t1)!important;caret-color:var(--ok)!important;}
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus,#newPw:-webkit-autofill,#authPw:-webkit-autofill,#authPw2:-webkit-autofill{
  -webkit-box-shadow:0 0 0 1000px #0B0D10 inset!important;box-shadow:0 0 0 1000px #0B0D10 inset!important;
  -webkit-text-fill-color:var(--t1)!important;caret-color:var(--ok)!important;transition:background-color 99999s ease!important;}
input:autofill{box-shadow:0 0 0 1000px #0B0D10 inset!important;-webkit-text-fill-color:var(--t1)!important;}
.int-search button,.int-save,.auth-submit,#crsFind{font-family:var(--font-h)!important;text-transform:uppercase;letter-spacing:.06em!important;
  background:radial-gradient(120% 120% at 30% 20%,#FF8A33,var(--sig) 60%,#C24E00)!important;color:#14171B!important;border:2px solid #0B0D10!important;border-radius:4px!important;
  box-shadow:0 4px 0 #0B0D10,inset 0 2px 0 rgba(255,255,255,.4),0 0 18px rgba(255,106,0,.4)!important;}
.int-save:active,.auth-submit:active{transform:translateY(3px);box-shadow:0 1px 0 #0B0D10,inset 0 3px 8px rgba(0,0,0,.5)!important;}
.int-ghost{font-family:var(--font-m)!important;background:linear-gradient(180deg,#4A525B,#2C333B)!important;color:var(--t2)!important;border:1px solid #0B0D10!important;border-radius:3px!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 3px 0 #0B0D10!important;}
.int-close,.auth-close{background:var(--steelg)!important;border:1px solid #0B0D10!important;border-radius:50%!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 2px 0 #0B0D10!important;}
.int-chip,.cj-item{background:#1A1F26!important;border:1px solid #0B0D10!important;border-left:4px solid var(--info)!important;border-radius:3px!important;font-family:var(--font-m)!important;}
.crs-row{background:#1A1F26!important;border:1px solid #0B0D10!important;border-radius:3px!important;}
/* НАСТРОЙКИ = табло оператора */
.info-row{border-bottom:1px solid transparent!important;background:linear-gradient(180deg,transparent 46%,#0B0D10 46% 54%,transparent 54%)!important;}
.info-row span:first-child{font-family:var(--font-h)!important;text-transform:uppercase;letter-spacing:.06em!important;font-size:11px!important;color:var(--t2)!important;
  text-shadow:0 1px 0 rgba(255,255,255,.12),0 -1px 0 rgba(0,0,0,.8);}
.info-row span:last-child{font-family:var(--font-m)!important;color:var(--ok)!important;text-shadow:0 0 7px rgba(53,240,106,.6)!important;}
.auth-field label{font-family:var(--font-h)!important;color:var(--pipe)!important;}
.danger-zone{border-top:2px dashed var(--danger)!important;}
.danger-zone .auth-hint{font-family:var(--font-h)!important;text-transform:uppercase;color:var(--danger)!important;text-shadow:0 0 10px rgba(255,59,48,.6);}
.btn-danger{font-family:var(--font-m)!important;background:#14171B!important;border:2px solid var(--danger)!important;color:var(--danger)!important;border-radius:3px!important;
  box-shadow:inset 0 0 0 1px #0B0D10,0 0 14px rgba(255,59,48,.35)!important;position:relative;}
.btn-danger::after{content:'';position:absolute;inset:-6px -5px auto -5px;height:10px;background:repeating-linear-gradient(45deg,var(--danger) 0 8px,#14171B 8px 16px);
  border:1px solid #0B0D10;opacity:.8;pointer-events:none;}
.btn-danger:hover{background:var(--danger)!important;color:#14171B!important;}
#editInterestsBtn,#saveSettingsBtn{font-family:var(--font-h)!important;text-transform:uppercase;letter-spacing:.05em!important;}
/* АДАПТИВ */
@media(max-width:1279px) and (min-width:768px){
  .sidebar{width:76px!important;min-width:76px!important;padding:16px 8px!important;}
  .sidebar .side-label,.sidebar .cat-name,.sidebar .manage,.sidebar .course-title,.sidebar .course-learners{display:none!important;}
  .side-item{padding-left:0!important;justify-content:center;}
  .side-item::before{left:50%;top:8px;transform:translateX(-50%);}
}
@media(max-width:767px){
  #lab-bg{position:fixed;height:220px;top:0;bottom:auto;}
  .int-box,.auth-box,.cj-box{max-height:100vh!important;width:100%!max-width:none!important;border-radius:0!important;}
  .iconbtn,.avatar,.pill,.side-item,.act{min-height:44px;min-width:44px;}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;transition-duration:.001s!important;}
  #lab-canvas{display:none!important;}
}

<script>
(function(){

  /* ---------- 2D FALLBACK ---------- */

    two.hidden=false;
    two.innerHTML =
    '<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">'

    +'<g data-d="0.3"><rect x="60" y="120" width="1480" height="420" fill="#1A1F26"/><g fill="#B9B4A8" opacity=".12"><rect x="60" y="120" width="1480" height="6"/></g>'

    +'<g fill="#B87333"><rect x="200" y="450" width="200" height="14" rx="7"/><rect x="490" y="470" width="200" height="14" rx="7"/><rect x="920" y="450" width="200" height="14" rx="7"/><rect x="1210" y="470" width="200" height="14" rx="7"/></g>'
    +'<rect x="700" y="330" width="200" height="90" rx="45" fill="#8A939E"/><rect x="690" y="320" width="18" height="110" rx="6" fill="#3A4149"/><rect x="892" y="320" width="18" height="110" rx="6" fill="#3A4149"/>'
    +'<rect x="790" y="180" width="34" height="150" fill="#F5C400"/><rect x="770" y="170" width="74" height="18" rx="6" fill="#F5C400"/></g>'
    +'<g data-d="0.8" fill="none" stroke-linecap="round"><path d="M120 880 C 300 700 260 620 420 600" stroke="#0B0D10" stroke-width="14"/><path d="M120 880 C 300 700 260 620 420 600" stroke="#E23B2E" stroke-width="5"/>'
    +'<path d="M1480 880 C 1300 700 1340 620 1180 600" stroke="#0B0D10" stroke-width="14"/><path d="M1480 880 C 1300 700 1340 620 1180 600" stroke="#2E7BE2" stroke-width="5"/></g>'
    +'<g data-d="1"><rect x="600" y="560" width="400" height="16" fill="#FF6A00"/><g fill="#FF6A00"><rect x="610" y="576" width="8" height="60"/><rect x="790" y="576" width="8" height="60"/><rect x="980" y="576" width="8" height="60"/></g></g>'
    +'</svg>';
    if(!reduced){
      var layers = two.querySelectorAll('[data-d]');
      addEventListener('pointermove', function(e){
        var dx=(e.clientX/innerWidth-.5), dy=(e.clientY/innerHeight-.5);
        layers.forEach(function(l){ var d=+l.getAttribute('data-d'); l.setAttribute('transform','translate('+(-dx*26*d)+' '+(-dy*16*d)+')'); });
      }, {passive:true});
    }
  }

  /* ---------- 3D ЗАЛ ---------- */
  var renderer, scene, camera, rafId=null, clockT=0, paused=false;
  var impulses=[], needles=[], flickLight=null, flickMat=null, dust=null, beam=null;
  var sph={th:0.0,ph:1.25,r:13}, target=new THREE.Vector3(0,2.1,-4);
  var pointer={x:0,y:0}, dragging=false, lastPX=0, lastPY=0, scrollY=0;
  function ct(w,h,draw){ var c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h); var t=new THREE.CanvasTexture(c); t.anisotropy=4; return t; }
  function texConcrete(){ return ct(256,256,function(x,w,h){ x.fillStyle='#6E6A62'; x.fillRect(0,0,w,h); x.strokeStyle='rgba(0,0,0,.35)'; x.lineWidth=2;
      for(var i=0;i<4;i++){ x.beginPath(); x.moveTo(i*64,0); x.lineTo(i*64,h); x.stroke(); x.beginPath(); x.moveTo(0,i*64); x.lineTo(w,i*64); x.stroke(); }
      for(var s=0;s<220;s++){ x.fillStyle='rgba(0,0,0,'+(Math.random()*.12)+')'; x.fillRect(Math.random()*w,Math.random()*h,2,2); } }); }
  function texFloor(){ return ct(256,256,function(x,w,h){ x.fillStyle='#23282E'; x.fillRect(0,0,w,h); x.strokeStyle='rgba(245,196,0,.5)'; x.lineWidth=3;
      x.strokeRect(20,20,w-40,h-40); x.strokeStyle='rgba(255,255,255,.06)'; x.lineWidth=1;
      for(var i=0;i<8;i++){ x.beginPath(); x.moveTo(i*32,0); x.lineTo(i*32,h); x.stroke(); } }); }
  function texStencil(txt,col){ return ct(256,128,function(x,w,h){ x.clearRect(0,0,w,h); x.fillStyle=col; x.font='700 64px monospace'; x.textAlign='center'; x.textBaseline='middle'; x.fillText(txt,w/2,h/2); }); }
  function texSign(){ return ct(512,192,function(x,w,h){ x.fillStyle='#E8EDF2'; x.fillRect(0,0,w,h); x.lineWidth=14; x.strokeStyle='#E23B2E'; x.strokeRect(7,7,w-14,h-14);
      x.fillStyle='#14171B'; x.font='700 44px monospace'; x.textAlign='center'; x.fillText('ВЫСОКОЕ НАПРЯЖЕНИЕ',w/2,78); x.font='700 34px monospace'; x.fillStyle='#E23B2E'; x.fillText('ОПАСНО ДЛЯ ЖИЗНИ',w/2,136); }); }
  function texGlow(col){ return ct(64,64,function(x,w,h){ var g=x.createRadialGradient(32,32,0,32,32,32); g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)'); x.fillStyle=g; x.fillRect(0,0,w,h); }); }

  function init3D(){
    var cv=document.getElementById('lab-canvas');
    renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio, mobile?1:1.5));
    renderer.setSize(innerWidth,innerHeight);
    renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    scene=new THREE.Scene(); scene.background=new THREE.Color(0x0D1117);
    scene.fog=new THREE.Fog(0x0D1117,16,58);
    camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,200);

    var conc=texConcrete(), flo=texFloor();
    var floor=new THREE.Mesh(new THREE.PlaneGeometry(70,46), new THREE.MeshStandardMaterial({map:flo,roughness:.9}));
    floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
    var wallM=new THREE.MeshStandardMaterial({map:conc,roughness:.95});
    var back=new THREE.Mesh(new THREE.BoxGeometry(60,12,1),wallM); back.position.set(0,6,-14); scene.add(back);
    var wl=new THREE.Mesh(new THREE.BoxGeometry(1,12,40),wallM); wl.position.set(-18,6,-2); scene.add(wl);
    var wr=wl.clone(); wr.position.x=18; scene.add(wr);
    var sign=new THREE.Mesh(new THREE.PlaneGeometry(5,1.9), new THREE.MeshBasicMaterial({map:texSign()})); sign.position.set(-7,4.2,-13.4); scene.add(sign);
    for(var e=0;e<2;e++){ var ex=new THREE.Mesh(new THREE.CylinderGeometry(.16,.16,.7,12), new THREE.MeshStandardMaterial({color:0xE23B2E,roughness:.5}));
      ex.position.set(-11+e*1.2,1.1,-13.2); ex.castShadow=true; scene.add(ex); }
    for(var m=0;m<3;m++){ var g=new THREE.Group();
      var face=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.08,20), new THREE.MeshStandardMaterial({color:0xE8EDF2,roughness:.4}));
      face.rotation.x=Math.PI/2; g.add(face);
      var nd=new THREE.Mesh(new THREE.BoxGeometry(.03,.3,.02), new THREE.MeshBasicMaterial({color:0xE23B2E})); nd.position.y=.12; g.add(nd);
      g.position.set(6+m*1.1,3.4,-13.3); scene.add(g); needles.push(nd); }

    var magGeo=new THREE.BoxGeometry(2.6,1.6,1.9);
    var magMat=new THREE.MeshStandardMaterial({color:0x1D4ED8,roughness:.55,metalness:.25});
    var labels=['1F2','2D3','1G','2E3','1D','2F3','1E','2G3','1C','2D'];
    var wind=new THREE.InstancedMesh(new THREE.TorusGeometry(.62,.1,8,18), new THREE.MeshStandardMaterial({color:0xB87333,metalness:.85,roughness:.35}), 40);
    var bolts=new THREE.InstancedMesh(new THREE.CylinderGeometry(.06,.06,.14,6), new THREE.MeshStandardMaterial({color:0x8A939E,metalness:.9,roughness:.4}), 96);
    var dummy=new THREE.Object3D(), bi=0;
    for(var i=0;i<10;i++){
      var mg=new THREE.Mesh(magGeo,magMat);
      var row=i%2, xx=-11+Math.floor(i/2)*4.6+row*1.4, zz=-6-row*3.4;
      mg.position.set(xx,1.0,zz); mg.castShadow=true; mg.receiveShadow=true; scene.add(mg);
      var lp=new THREE.Mesh(new THREE.PlaneGeometry(1.5,.75), new THREE.MeshBasicMaterial({map:texStencil(labels[i],'#E8EDF2'),transparent:true}));
      lp.position.set(xx,1.25,zz+0.96); scene.add(lp);
      for(var wq=0;wq<4;wq++){ dummy.position.set(xx-0.9+wq*0.6,1.0,zz); dummy.rotation.set(0,0,Math.PI/2); dummy.updateMatrix(); wind.setMatrixAt(i*4+wq,dummy.matrix); }
      for(var b=0;b<4;b++){ dummy.position.set(xx-1.1+(b%2)*2.2, .25+Math.floor(b/2)*1.5, zz+0.98); dummy.rotation.set(Math.PI/2,0,0); dummy.updateMatrix(); if(bi<96) bolts.setMatrixAt(bi++,dummy.matrix); }
    }
    wind.instanceMatrix.needsUpdate=true; bolts.instanceMatrix.needsUpdate=true; scene.add(wind); scene.add(bolts);

    var steel=new THREE.MeshStandardMaterial({color:0x8A939E,metalness:.95,roughness:.25});
    var cyl=new THREE.Mesh(new THREE.CylinderGeometry(.75,.75,7,26),steel); cyl.rotation.z=Math.PI/2; cyl.position.set(0,1.7,-4); cyl.castShadow=true; scene.add(cyl);
    for(var f=0;f<4;f++){ var fl=new THREE.Mesh(new THREE.CylinderGeometry(1.0,1.0,.3,26),steel); fl.rotation.z=Math.PI/2; fl.position.set(-2.4+f*1.6,1.7,-4); scene.add(fl);
      for(var fb=0;fb<8;fb++){ var a=fb/8*Math.PI*2; dummy.position.set(-2.4+f*1.6,1.7+Math.sin(a)*0.88,-4+Math.cos(a)*0.88); dummy.rotation.set(0,0,Math.PI/2); dummy.updateMatrix(); if(bi<96) bolts.setMatrixAt(bi++,dummy.matrix); } }
    bolts.instanceMatrix.needsUpdate=true;
    beam=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,7,12), new THREE.MeshBasicMaterial({color:0x4CC3FF,transparent:true,opacity:.85,blending:THREE.AdditiveBlending}));
    beam.rotation.z=Math.PI/2; beam.position.set(0,1.7,-4); scene.add(beam);
    var bs=new THREE.Sprite(new THREE.SpriteMaterial({map:texGlow('rgba(76,195,255,.9)'),blending:THREE.AdditiveBlending,depthWrite:false}));
    bs.scale.set(4,4,1); bs.position.set(0,1.7,-4); scene.add(bs);

    var wcurve=new THREE.CatmullRomCurve3([new THREE.Vector3(1.6,1.7,-4),new THREE.Vector3(1.6,3.4,-4),new THREE.Vector3(1.6,3.9,-7),new THREE.Vector3(1.6,3.9,-13)]);
    var wave=new THREE.Mesh(new THREE.TubeGeometry(wcurve,48,.3,12), new THREE.MeshStandardMaterial({color:0xF5C400,metalness:.7,roughness:.35}));
    wave.castShadow=true; scene.add(wave);
    for(var wf=0;wf<3;wf++){ var t2=[0.15,0.5,0.85][wf], p=wcurve.getPointAt(t2);
      var ring=new THREE.Mesh(new THREE.TorusGeometry(.34,.08,8,18), new THREE.MeshStandardMaterial({color:0xF5C400,metalness:.7,roughness:.35}));
      ring.position.copy(p); ring.rotation.y=Math.PI/2; scene.add(ring); }

    var plat=new THREE.Mesh(new THREE.BoxGeometry(12,.25,2.4), new THREE.MeshStandardMaterial({color:0x3A4149,metalness:.6,roughness:.6}));
    plat.position.set(0,1.15,-0.6); plat.receiveShadow=true; scene.add(plat);
    var railM=new THREE.MeshStandardMaterial({color:0xFF6A00,roughness:.5});
    for(var rp=0;rp<7;rp++){ var post=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,1.0,8),railM); post.position.set(-5.5+rp*1.83,1.75,0.5); scene.add(post); }
    var rail=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,12,8),railM); rail.rotation.z=Math.PI/2; rail.position.set(0,2.25,0.5); scene.add(rail);

    var cabCols=[0x0B0D10,0xE23B2E,0x2E7BE2,0x0B0D10,0xE23B2E,0x2E7BE2];
    for(var cI=0;cI<6;cI++){
      var sx=-10+cI*4, pts=[new THREE.Vector3(sx,0.1,1.5),new THREE.Vector3(sx+1.2,0.5,-1),new THREE.Vector3(sx+0.4,1.2,-3),new THREE.Vector3(sx+1.6,0.4,-5.4)];
      var cc=new THREE.CatmullRomCurve3(pts);
      var tube=new THREE.Mesh(new THREE.TubeGeometry(cc,40,.06,6), new THREE.MeshStandardMaterial({color:cabCols[cI],roughness:.6}));
      scene.add(tube);
      var imp=new THREE.Mesh(new THREE.SphereGeometry(.11,8,8), new THREE.MeshBasicMaterial({color:0x35F06A,blending:THREE.AdditiveBlending,transparent:true}));
      scene.add(imp); impulses.push({curve:cc,mesh:imp,t:Math.random()});
    }

    scene.add(new THREE.HemisphereLight(0x8899AA,0x0D1117,.45));
    var key=new THREE.DirectionalLight(0xFFE0B0,1.05); key.position.set(7,9,7); key.castShadow=true;
    key.shadow.mapSize.set(1024,1024); key.shadow.camera.left=-20; key.shadow.camera.right=20; key.shadow.camera.top=14; key.shadow.camera.bottom=-6;
    scene.add(key); renderer.shadowMap.autoUpdate=false; renderer.shadowMap.needsUpdate=true;
    var rim=new THREE.PointLight(0x2E7BE2,.9,34); rim.position.set(-9,4.5,-9); scene.add(rim);
    var fill=new THREE.PointLight(0xFF6A00,.55,26); fill.position.set(5,2.2,3); scene.add(fill);
    flickLight=new THREE.PointLight(0xE8EDF2,.7,22); flickLight.position.set(0,5.4,-2); scene.add(flickLight);
    for(var pn=0;pn<4;pn++){ var panel=new THREE.Mesh(new THREE.PlaneGeometry(6,.5), new THREE.MeshBasicMaterial({color:0xE8EDF2}));
      panel.rotation.x=Math.PI/2; panel.position.set(-9+pn*6,5.8,-4); scene.add(panel); }
    flickMat=scene.children[scene.children.length-3].material;

    var dg=new THREE.BufferGeometry(), dp=new Float32Array(140*3);
    for(var d3=0;d3<140;d3++){ dp[d3*3]=(Math.random()-.5)*30; dp[d3*3+1]=Math.random()*6; dp[d3*3+2]=(Math.random()-.5)*24-4; }
    dg.setAttribute('position',new THREE.BufferAttribute(dp,3));
    dust=new THREE.Points(dg,new THREE.PointsMaterial({color:0xE8EDF2,size:.035,transparent:true,opacity:.4,blending:THREE.AdditiveBlending,depthWrite:false}));
    scene.add(dust);

    addEventListener('resize',function(){ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); },{passive:true});
    /* сцена — фон: тяжёлый демпфированный параллакс (курсор + скролл), без orbit и zoom */
    var tYaw=0,tPitch=0,tScroll=0,cYaw=0,cPitch=0,cScroll=0;
    if(!reduced){
      addEventListener('pointermove',function(e){
        tYaw=(e.clientX/innerWidth-.5)*.10;
        tPitch=(e.clientY/innerHeight-.5)*.05;
      },{passive:true});
      addEventListener('scroll',function(){ tScroll=window.scrollY||0; },{passive:true});
    }
    document.addEventListener('visibilitychange',function(){ paused=document.hidden; if(!paused) loop(); });

    var last=performance.now();
    function loop(){
      if(paused){ return; }
      rafId=requestAnimationFrame(loop);
      var now=performance.now(), raw=(now-last)/1000;
      if(raw < 1/30){ return; }
      var dt=Math.min(.05,raw); last=now; clockT+=dt;
      var k=1-Math.exp(-dt*3);
      cYaw+=(tYaw-cYaw)*k; cPitch+=(tPitch-cPitch)*k; cScroll+=(tScroll-cScroll)*k;
      var sc=Math.min(cScroll,1200);
      var th=Math.sin(clockT*.07)*.16+cYaw+sc*.00022;
      var ph=sph.ph+cPitch;
      var r=sph.r;
      camera.position.set(target.x+r*Math.sin(ph)*Math.sin(th), target.y+r*Math.cos(ph)-sc*.0006, target.z+r*Math.sin(ph)*Math.cos(th));
      camera.lookAt(target);
      for(var i2=0;i2<impulses.length;i2++){ var o=impulses[i2]; o.t=(o.t+dt*.16)%1; o.mesh.position.copy(o.curve.getPointAt(o.t)); }
      for(var n2=0;n2<needles.length;n2++){ needles[n2].rotation.z=Math.sin(clockT*(.7+n2*.23)+n2)*.5; }
      if(flickLight){ var fl2=(Math.sin(clockT*37)>0.92||Math.sin(clockT*13.7)>0.97)?0.15:0.7; flickLight.intensity=fl2; if(flickMat) flickMat.color.setScalar(fl2>0.4?1:0.35); }
      if(beam){ beam.material.opacity=.65+Math.sin(clockT*6)*.2; }
      if(dust){ dust.rotation.y+=dt*.01; }
      renderer.render(scene,camera);
    }
    loop();
  }
  var lite = location.search.indexOf('lite') > -1;
  if(!webglOK() || reduced || weak || lite){ build2D(); } else { try{ init3D(); }catch(e){ build2D(); } }

  /* ---------- КАБЕЛИ SVG ---------- */
  var cabSvg=document.getElementById('lab-cables'), cores=[], cabRaf=false;
  function layoutCables(){
    var w=innerWidth,h=innerH||innerHeight, n=mobile?2:4, out='';
    var anchors=[[0.22,0.42,0.5,0.3],[0.22,0.6,0.62,0.5],[0.78,0.35,0.6,0.2],[0.5,0.9,0.5,0.62]];
    if(mobile) anchors=anchors.slice(0,2);
    var cols=['#E23B2E','#2E7BE2','#F5C400','#35F06A'];
    for(var i=0;i<anchors.length;i++){
      var a=anchors[i], x1=a[0]*w,y1=a[1]*h,x2=a[2]*w,y2=a[3]*h, mx=(x1+x2)/2, my=Math.max(y1,y2)+90;
      var d='M'+x1+' '+y1+' C '+x1+' '+my+', '+x2+' '+my+', '+x2+' '+y2;
      out+='<path d="'+d+'" fill="none" stroke="#0B0D10" stroke-width="9" stroke-linecap="round" opacity=".9"/>'
         + '<path class="lab-core" data-i="'+i+'" d="'+d+'" fill="none" stroke="'+cols[i%4]+'" stroke-width="3" stroke-linecap="round" opacity=".85"/>';
    }
    cabSvg.setAttribute('viewBox','0 0 '+w+' '+h); cabSvg.innerHTML=out;
    cores=[].slice.call(cabSvg.querySelectorAll('.lab-core'));
    cores.forEach(function(c){ var L=c.getTotalLength(); c.style.strokeDasharray=L; c.style.strokeDashoffset=0; });
  }
  function queueCables(){ if(cabRaf) return; cabRaf=true; requestAnimationFrame(function(){ cabRaf=false; layoutCables(); }); }
  layoutCables(); addEventListener('resize',queueCables,{passive:true});
  function pulse(){
    if(reduced||!cores.length) return;
    var c=cores[Math.floor(Math.random()*cores.length)], L=c.getTotalLength();
    c.style.strokeDasharray=L; c.style.strokeDashoffset=L;
    if(window.gsap){ gsap.to(c,{strokeDashoffset:0,duration:.7,ease:'power2.out'}); } else { c.style.strokeDashoffset=0; }
  }
  document.addEventListener('click',function(e){
    if(e.target.closest('#intSave,.auth-submit,.act.bm,#intFind,.int-save,#saveSettingsBtn')) pulse();
  },true);

  /* ---------- DIM ПОД МОДАЛКАМИ ---------- */
  var dimRaf=false;
  function updDim(){ if(dimRaf) return; dimRaf=true; requestAnimationFrame(function(){ dimRaf=false;
    var open=document.querySelector('.int-overlay.open,.auth-overlay.open,.cj-overlay');
    document.body.classList.toggle('lab-dim',!!open); }); }
  new MutationObserver(updDim).observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});
  updDim();

  /* ---------- МОТИВ / GSAP ---------- */
  if(window.gsap && !reduced){
    gsap.from('.logo',{y:-14,rotation:-2,opacity:0,duration:.5,ease:'back.out(2.2)'});
    gsap.from('.topbar .iconbtn, .topbar .avatar',{scale:.6,opacity:0,duration:.4,stagger:.07,ease:'back.out(2.5)',delay:.15});
    gsap.from('.side-label',{x:-16,opacity:0,duration:.4,stagger:.08,ease:'power2.out',delay:.2});
    gsap.from('.side-item, .cat-card',{x:-22,opacity:0,duration:.45,stagger:.05,ease:'power3.out',delay:.3});
    gsap.from('.main-head h1',{y:10,opacity:0,duration:.5,ease:'power2.out',delay:.35});
    gsap.from('.card',{y:26,opacity:0,duration:.5,stagger:.06,ease:'power3.out',delay:.45});
    var mo=new MutationObserver(function(muts){
      muts.forEach(function(mu){
        var ov=mu.target;
        if(ov.classList && ov.classList.contains('open')){
          var box=ov.querySelector('.int-box,.auth-box,.cj-box');
          if(box) gsap.fromTo(box,{y:46,rotationX:-9,opacity:0},{y:0,rotationX:0,opacity:1,duration:.45,ease:'power3.inOut',
            onComplete:function(){ gsap.to(box,{y:2,duration:.12,yoyo:true,repeat:1,ease:'power1.inOut'}); }});
        }
      });
    });
    ['.int-overlay','.auth-overlay'].forEach(function(s){ var el=document.querySelector(s); if(el) mo.observe(el,{attributes:true,attributeFilter:['class']}); });
    document.addEventListener('click',function(e){
      var t=e.target.closest('.pill,.int-tab,.auth-tab,.side-item[data-mode]');
      if(t && window.gsap){ gsap.fromTo(t,{y:0},{y:2,duration:.05,yoyo:true,repeat:1,ease:'steps(2)'}); }
    },true);
  }

  /* ---------- МАНомЕТРЫ ПУЛЬТА + НУМЕРАЦИЯ ---------- */
  function addGauges(){
    var es=document.querySelector('.empty-state');
    if(!es || es.querySelector('.lab-gauge')) return;
    var btn=es.querySelector('button');
    var wrap=document.createElement('div');
    wrap.style.cssText='margin:18px 0 4px;';
    for(var g=0;g<2;g++){
      wrap.insertAdjacentHTML('beforeend',
      '<svg class="lab-gauge" viewBox="0 0 100 100" aria-hidden="true">'
      +'<circle cx="50" cy="50" r="44" fill="#0B0D10" stroke="#3A4149" stroke-width="4"/>'
      +'<circle cx="50" cy="50" r="36" fill="#14171B" stroke="#8A939E" stroke-width="2"/>'
      +'<g stroke="#9AA7B4" stroke-width="2">'+[ -52,-26,0,26,52 ].map(function(a){var r=a*Math.PI/180;return '<line x1="'+(50+Math.sin(r)*28)+'" y1="'+(50-Math.cos(r)*28)+'" x2="'+(50+Math.sin(r)*34)+'" y2="'+(50-Math.cos(r)*34)+'"/>';}).join('')+'</g>'
      +'<g class="needle"><line x1="50" y1="50" x2="50" y2="20" stroke="#E23B2E" stroke-width="3"/></g>'
      +'<circle cx="50" cy="50" r="5" fill="#8A939E"/></svg>');
    }
    es.insertBefore(wrap,btn);
  }
  function energize(){ document.querySelectorAll('.lab-gauge').forEach(function(g){ g.classList.add('on'); }); }
  addGauges();
  if(document.querySelectorAll('#interestsBox .cat-card').length>0) energize();
  document.addEventListener('click',function(e){ if(e.target.closest('#intSave')) setTimeout(energize,900); },true);

  var cards=document.querySelectorAll('.card');
  cards.forEach(function(c,i){ c.setAttribute('data-lab-n',String(i+1).padStart(2,'0')); });

  var fc=document.getElementById('intCount');
  if(fc){ new MutationObserver(function(){ fc.querySelectorAll('b').forEach(function(b){ b.classList.remove('lab-flick'); void b.offsetWidth; b.classList.add('lab-flick'); }); }).observe(fc,{childList:true,subtree:true,characterData:true}); }
  var rb=document.getElementById('refreshBtn');
  if(rb){ rb.addEventListener('click',function(){ rb.classList.add('lab-spin'); setTimeout(function(){ rb.classList.remove('lab-spin'); },4000); }); }
})();
</script>
