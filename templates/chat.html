<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EngFeed — Чат</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
    --bg: #0d0e0f;
    --panel: #151719;
    --card: #1a1d1f;
    --card2: #222629;
    --border: #2a2f33;
    --t1: #e8e6e3;
    --t2: #9a9895;
    --t3: #6b6966;
    --accent-sand: #d4b896;
    --accent-coral: #e07a5f;
    --accent-emerald: #81b29a;
    --accent-rust: #bc6c25;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--t1);
    height:100vh;
    display:flex;
    flex-direction:column;
}
.chat-header{
    height:68px;
    display:flex;
    align-items:center;
    gap:16px;
    padding:0 24px;
    background:var(--panel);
    border-bottom:2px solid var(--border);
    box-shadow: 0 4px 0 var(--accent-sand);
}
.chat-header .back-btn{
    width:40px;height:40px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--t1);
    cursor:pointer;
    display:grid;place-items:center;
    transition:.2s;
}
.chat-header .back-btn:hover{background:var(--card2);border-color:var(--accent-sand);}
.chat-header .back-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;}
.chat-header h1{
    font-size:20px;
    font-weight:700;
    font-family:'JetBrains Mono',monospace;
}
.chat-header h1::before{content:'// ';color:var(--accent-coral);}
.chat-header .members{
    margin-left:auto;
    font-size:12px;
    color:var(--t3);
    font-family:'JetBrains Mono',monospace;
}
.chat-container{
    flex:1;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}
.messages{
    flex:1;
    overflow-y:auto;
    padding:24px;
    display:flex;
    flex-direction:column;
    gap:16px;
}
.message{
    display:flex;
    gap:12px;
    max-width:70%;
    animation:msgIn .3s ease;
}
@keyframes msgIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.message.own{align-self:flex-end;flex-direction:row-reverse;}
.message-avatar{
    width:36px;height:36px;
    border-radius:50%;
    background:var(--card2);
    border:2px solid var(--accent-sand);
    display:grid;place-items:center;
    font-size:14px;
    font-weight:700;
    color:var(--accent-sand);
    flex-shrink:0;
}
.message-content{
    background:var(--card);
    border:1px solid var(--border);
    border-left:3px solid var(--accent-emerald);
    padding:12px 16px;
    border-radius:4px;
}
.message.own .message-content{
    background:var(--accent-sand);
    color:var(--bg);
    border-left:none;
    border-right:3px solid var(--accent-coral);
}
.message-header{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:6px;
    font-size:11px;
    font-family:'JetBrains Mono',monospace;
    color:var(--t3);
}
.message.own .message-header{color:var(--bg);opacity:0.7;}
.message-username{font-weight:700;color:var(--accent-emerald);}
.message.own .message-username{color:var(--bg);}
.message-text{
    font-size:14px;
    line-height:1.6;
    word-wrap:break-word;
}
.message-attachment{
    margin-top:8px;
    max-width:300px;
}
.message-attachment img{
    max-width:100%;
    border-radius:4px;
    border:1px solid var(--border);
}
.message-attachment .file-link{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 12px;
    background:var(--card2);
    border:1px solid var(--border);
    border-radius:4px;
    text-decoration:none;
    color:var(--t1);
    font-size:12px;
    font-family:'JetBrains Mono',monospace;
}
.message-attachment .file-link:hover{background:var(--card);border-color:var(--accent-sand);}
.message-time{
    font-size:10px;
    color:var(--t3);
    margin-top:4px;
    text-align:right;
}
.message.own .message-time{color:var(--bg);opacity:0.6;}
.input-area{
    padding:16px 24px;
    background:var(--panel);
    border-top:1px solid var(--border);
    display:flex;
    gap:12px;
    align-items:flex-end;
}
.input-wrapper{
    flex:1;
    display:flex;
    gap:8px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:4px;
    padding:8px;
}
.input-wrapper textarea{
    flex:1;
    background:none;
    border:none;
    color:var(--t1);
    font-size:14px;
    font-family:'Inter',sans-serif;
    resize:none;
    outline:none;
    max-height:120px;
    min-height:24px;
}
.input-wrapper .attach-btn{
    width:36px;height:36px;
    border:1px solid var(--border);
    background:var(--card2);
    color:var(--t2);
    cursor:pointer;
    display:grid;place-items:center;
    transition:.2s;
}
.input-wrapper .attach-btn:hover{background:var(--card);border-color:var(--accent-sand);color:var(--t1);}
.input-wrapper .attach-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;}
.send-btn{
    height:52px;
    padding:0 24px;
    background:var(--accent-emerald);
    color:var(--bg);
    border:none;
    font-weight:700;
    font-family:'JetBrains Mono',monospace;
    cursor:pointer;
    transition:.2s;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
}
.send-btn:hover{background:var(--accent-sand);transform:translateY(-2px);}
.send-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
.typing-indicator{
    font-size:12px;
    color:var(--t3);
    font-family:'JetBrains Mono',monospace;
    padding:0 24px 8px;
    height:20px;
}
.empty-chat{
    text-align:center;
    padding:80px 20px;
    color:var(--t3);
}
.empty-chat p{font-size:16px;margin-bottom:8px;}
</style>
<style id="theme-lab">
:root{
  --bg:#14181c; --panel:#1b2127; --card:#20272e; --card2:#2a333c; --border:#3a454f;
  --t1:#e6eaee; --t2:#9aa6b2; --t3:#6b7885;
  --accent-sand:#f07d1f; --accent-emerald:#2e86c8; --accent-rust:#e3b500; --accent-coral:#cf4a2e;
}
body{background:var(--bg)!important;color:var(--t1)!important;}
.chat-header{background:var(--panel)!important;border-bottom:1px solid var(--border)!important;box-shadow:none!important;}
.chat-header h1::before{content:'● ';color:var(--accent-sand)!important;}
.chat-header h1{font-family:'JetBrains Mono',monospace!important;}
.chat-header .back-btn,.send-btn,.input-wrapper{border-radius:6px!important;}
.send-btn{background:var(--accent-sand)!important;color:#14181c!important;}
.send-btn:hover{background:var(--accent-rust)!important;}
.message-content{border-left-color:var(--accent-emerald)!important;}
.message.own .message-content{background:var(--accent-sand)!important;color:#14181c!important;border-right-color:var(--accent-rust)!important;}
.message.own .message-header,.message.own .message-username,.message.own .message-time{color:#14181c!important;}
.message-avatar{border-color:var(--accent-sand)!important;color:var(--accent-sand)!important;background:#0c0f12!important;}
</style>
</head>
<body>
<div class="chat-header">
    <button class="back-btn" onclick="location.href='/'">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <h1 id="roomTitle">Загрузка...</h1>
    <span class="members" id="membersCount">0 участников</span>
</div>

<div class="chat-container">
    <div class="messages" id="messages"></div>
    <div class="typing-indicator" id="typing"></div>
    <div class="input-area">
        <div class="input-wrapper">
            <textarea id="messageInput" placeholder="Написать сообщение..." rows="1"></textarea>
            <button class="attach-btn" id="attachBtn" title="Прикрепить файл">
                <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </button>
            <input type="file" id="fileInput" style="display:none" accept="image/*,.pdf,.txt,.doc,.docx">
        </div>
        <button class="send-btn" id="sendBtn">Отправить</button>
    </div>
</div>

<script>
const roomSlug = new URLSearchParams(location.search).get('room');
const userId = {{ session.get('uid', 0) }};
const username = '{{ session.get("username", "Аноним") }}';
let lastTimestamp = 0;
let pollTimer = null;

function formatTime(ts) {
    const d = new Date(ts * 1000);
    return d.toLocaleTimeString('ru-RU', {hour: '2-digit', minute: '2-digit'});
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function renderMessage(msg) {
    const isOwn = msg.user_id === userId;
    const initial = msg.username.charAt(0).toUpperCase();
    
    let attachmentHtml = '';
    if (msg.attachment_type === 'image' && msg.attachment_url) {
        attachmentHtml = '<div class="message-attachment"><img src="' + msg.attachment_url + '" alt="attachment"></div>';
    } else if (msg.attachment_type === 'file' && msg.attachment_url) {
        const size = msg.attachment_size ? (msg.attachment_size / 1024).toFixed(0) + 'KB' : '';
        attachmentHtml = '<div class="message-attachment"><a href="' + msg.attachment_url + '" class="file-link" download>📎 Файл ' + size + '</a></div>';
    }
    
    const html = '<div class="message ' + (isOwn ? 'own' : '') + '">' +
        '<div class="message-avatar">' + initial + '</div>' +
        '<div class="message-content">' +
        '<div class="message-header"><span class="message-username">' + escapeHtml(msg.username) + '</span><span>' + formatTime(msg.created_at) + '</span></div>' +
        '<div class="message-text">' + escapeHtml(msg.content) + '</div>' +
        attachmentHtml +
        '</div></div>';
    
    const messagesDiv = document.getElementById('messages');
    messagesDiv.insertAdjacentHTML('beforeend', html);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

async function pollMessages() {
    try {
        const res = await fetch('/api/chat/rooms/' + roomSlug + '/messages?since=' + lastTimestamp + '&timeout=25');
        const data = await res.json();
        
        if (data.messages && data.messages.length) {
            data.messages.forEach(renderMessage);
            lastTimestamp = data.last_timestamp;
        }
        
        pollTimer = setTimeout(pollMessages, 1000);
    } catch (e) {
        console.error('Poll error:', e);
        pollTimer = setTimeout(pollMessages, 3000);
    }
}

async function sendMessage() {
    const input = document.getElementById('messageInput');
    const content = input.value.trim();
    if (!content) return;
    
    const sendBtn = document.getElementById('sendBtn');
    sendBtn.disabled = true;
    
    try {
        const res = await fetch('/api/chat/rooms/' + roomSlug + '/messages', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({content})
        });
        
        if (res.ok) {
            input.value = '';
            input.style.height = 'auto';
        } else {
            const data = await res.json();
            if (data.error === 'profanity_detected') {
                alert('Сообщение содержит запрещённые слова');
            } else if (data.error === 'rate_limit') {
                alert('Слишком много сообщений. Подождите минуту.');
            }
        }
    } catch (e) {
        console.error('Send error:', e);
    } finally {
        sendBtn.disabled = false;
    }
}

async function uploadFile(file) {
    const formData = new FormData();
    formData.append('file', file);
    
    try {
        const res = await fetch('/api/chat/upload', {
            method: 'POST',
            body: formData
        });
        
        if (res.ok) {
            const data = await res.json();
            const content = document.getElementById('messageInput').value.trim();
            
            await fetch('/api/chat/rooms/' + roomSlug + '/messages', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    content: content,
                    attachment_type: data.type,
                    attachment_url: data.url,
                    attachment_size: data.size
                })
            });
            
            document.getElementById('messageInput').value = '';
        } else {
            const data = await res.json();
            alert('Ошибка загрузки: ' + data.error);
        }
    } catch (e) {
        console.error('Upload error:', e);
    }
}

document.addEventListener('DOMContentLoaded', async () => {
    if (!roomSlug) {
        location.href = '/';
        return;
    }
    
    try {
        const res = await fetch('/api/chat/rooms');
        const data = await res.json();
        const room = data.rooms.find(r => r.slug === roomSlug);
        if (room) {
            document.getElementById('roomTitle').textContent = room.title;
            document.getElementById('membersCount').textContent = 'Чат';
        }
    } catch (e) {
        console.error('Load rooms error:', e);
    }
    
    try {
        const res = await fetch('/api/chat/rooms/' + roomSlug + '/messages?since=0&timeout=1');
        const data = await res.json();
        if (data.messages) {
            data.messages.forEach(renderMessage);
            lastTimestamp = data.last_timestamp || 0;
        }
    } catch (e) {
        console.error('Load messages error:', e);
    }
    
    pollMessages();
    
    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    document.getElementById('messageInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
    
    document.getElementById('messageInput').addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });
    
    document.getElementById('attachBtn').addEventListener('click', () => {
        document.getElementById('fileInput').click();
    });
    
    document.getElementById('fileInput').addEventListener('change', (e) => {
        if (e.target.files[0]) {
            uploadFile(e.target.files[0]);
        }
    });
});
</script>
</body>
</html>
