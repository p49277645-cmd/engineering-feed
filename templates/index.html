<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ENGFEED 2.0 · научная лента</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#080D16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ENGFEED">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080D16;
  --accent:#398BFF; --accent-deep:#1F6FE0; --cyan:#4CC3FF;
  --amber:#FF941F; --green:#35F06A; --yellow:#F5C400; --red:#FF5A4E;
  --text:#F1F5FC; --text2:#9AAABD; --text3:#A5B2C4;
  --panel:rgba(13,22,36,.92); --panel2:rgba(15,25,40,.88);
  --card:rgba(16,27,43,.93); --field:rgba(18,28,43,.88);
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.08);
  --r-panel:22px; --r-card:20px; --r-search:18px; --r-btn:14px; --r-icon:12px; --r-tag:8px; --r-pill:999px;
  --shadow:0 8px 30px rgba(0,0,0,.20);
  --font:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0;}
html{scrollbar-color:var(--accent) #0B1424;}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:#0B1424;}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--accent),var(--accent-deep));border:2px solid #0B1424;border-radius:var(--r-pill);}
::-webkit-scrollbar-thumb:hover{background:var(--cyan);}
button{font-family:inherit;}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.bg-base{position:absolute;inset:0;background:
  radial-gradient(1200px 700px at 72% 18%, rgba(57,139,255,.10), transparent 60%),
  radial-gradient(900px 600px at 8% 85%, rgba(255,148,31,.05), transparent 60%),
  var(--bg);}
.bg-photo{position:absolute;inset:-6%;background-image:url('/assets/background/accelerator-desktop.png'),url('/assets/background/accelerator-desktop.webp'),url('/assets/background/accelerator-desktop.jpg');
  background-size:cover;background-position:70% 25%;opacity:.92;transform:scale(1.06);will-change:transform;}
#ring{position:absolute;right:-12%;top:4%;width:86vmin;height:86vmin;opacity:.26;mix-blend-mode:screen;will-change:transform;}
.bg-glow{position:absolute;inset:0;background:radial-gradient(700px 460px at 72% 18%, rgba(76,195,255,.14), transparent 65%);}
.bg-scrim-h{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,10,20,.92) 0%,rgba(5,10,20,.70) 35%,rgba(5,10,20,.25) 75%,rgba(5,10,20,.45) 100%);}
.bg-scrim-v{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,10,20,.20) 0%,rgba(5,10,20,.05) 40%,rgba(5,10,20,.70) 100%);}
body.eco .bg-photo,body.calm .bg-photo{transform:none!important;}
body.eco #ring,body.calm #ring{transform:none!important;}
body.eco .topbar,body.eco .tabbar,body.eco .pop{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;}
body.calm *{transition:none!important;animation:none!important;}
.wrap{position:relative;z-index:1;max-width:1560px;margin:0 auto;padding:16px 20px 40px;}
.topbar{position:sticky;top:12px;z-index:40;display:flex;align-items:center;gap:12px;height:76px;padding:0 16px;
  background:rgba(13,22,36,.86);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  border:1px solid var(--line);border-radius:var(--r-panel);box-shadow:var(--shadow);}
.logo{display:flex;align-items:center;gap:10px;flex:0 0 auto;text-decoration:none;color:var(--text);}
.logo svg{width:30px;height:30px;flex:0 0 auto;}
.logo b{font-size:19px;font-weight:800;letter-spacing:.02em;}
.searchwrap{position:relative;flex:1 1 200px;display:flex;align-items:center;height:46px;
  background:var(--field);border:1px solid var(--line2);border-radius:16px;transition:border-color .18s,box-shadow .18s;}
.searchwrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(57,139,255,.18);}
.searchwrap svg{position:absolute;left:14px;width:18px;height:18px;color:var(--text2);pointer-events:none;}
.searchwrap input{width:100%;height:100%;background:none;border:none;outline:none;color:var(--text);font-size:14px;padding:0 14px 0 42px;}
.searchwrap input::placeholder{color:var(--text2);}
select{height:46px;flex:0 0 auto;background:var(--field);border:1px solid var(--line2);border-radius:var(--r-btn);color:var(--text);font-size:13px;padding:0 12px;outline:none;cursor:pointer;}
.btn{height:46px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;
  background:var(--field);border:1px solid var(--line2);border-radius:var(--r-btn);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;
  transition:transform .15s,background .15s,border-color .15s,box-shadow .15s;}
.btn:hover{border-color:rgba(57,139,255,.45);}
.btn:active{transform:scale(.97);}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-deep));border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(57,139,255,.35);}
.btn.primary:hover{box-shadow:0 8px 22px rgba(57,139,255,.45);}
.btn.icon{width:46px;padding:0;border-radius:var(--r-icon);}
.btn.icon svg{width:20px;height:20px;}
.btn.small{height:36px;padding:0 12px;font-size:12px;border-radius:var(--r-icon);}
.btn.on{background:rgba(57,139,255,.18);border-color:rgba(57,139,255,.5);color:var(--cyan);}
.resume{margin:14px 0;display:flex;align-items:center;gap:0;height:54px;padding:0 16px;
  background:var(--panel2);border:1px solid var(--line);border-radius:16px;font-size:13px;color:var(--text2);overflow:hidden;}
.resume .seg{display:flex;align-items:center;gap:8px;padding:0 16px;height:100%;border-right:1px solid var(--line);white-space:nowrap;}
.resume .seg:first-child{padding-left:0;}
.resume .seg:last-child{border-right:none;}
.resume b{color:var(--text);font-weight:700;}
.resume b.cy{color:var(--cyan);}
.resume .dot{width:8px;height:8px;border-radius:var(--r-pill);background:var(--amber);box-shadow:0 0 8px rgba(255,148,31,.6);}
#statsToggle{display:none;margin-left:auto;}
.shell{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start;}
.sidebar{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-panel);padding:12px;
  position:sticky;top:100px;max-height:calc(100vh - 120px);overflow:auto;box-shadow:var(--shadow);}
.side-label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text2);padding:6px 8px 10px;}
.cat{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;padding:8px 12px;margin-bottom:6px;text-align:left;
  background:rgba(255,255,255,.03);border:1px solid transparent;border-radius:13px;color:var(--text2);cursor:pointer;position:relative;
  transition:background .15s,color .15s,border-color .15s;}
.cat:hover{background:rgba(255,255,255,.06);color:var(--text);}
.cat .ic{width:21px;height:21px;flex:0 0 auto;color:var(--cyan);opacity:.85;}
.cat .nm{flex:1 1 auto;font-size:14px;font-weight:600;line-height:1.25;}
.cat .cnt{font-family:var(--mono);font-size:11px;color:var(--text2);}
.cat .bar{position:absolute;left:12px;right:12px;bottom:5px;height:3px;border-radius:var(--r-pill);background:rgba(255,255,255,.07);overflow:hidden;}
.cat .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--cyan));}
.cat.active{background:linear-gradient(110deg,rgba(42,127,255,.30),rgba(28,83,160,.18));border-color:rgba(57,139,255,.35);color:var(--text);}
.cat.active::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:var(--r-pill);background:var(--cyan);}
.cat.active .cnt{color:var(--cyan);}
.srcs{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;}
.srcs a{display:block;font-family:var(--mono);font-size:11px;color:var(--cyan);text-decoration:none;padding:6px 8px;border-radius:8px;}
.srcs a:hover{background:rgba(57,139,255,.12);}
.chips{display:none;}
.mainhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.mainhead h1{font-size:22px;font-weight:800;letter-spacing:-.01em;}
.upd{font-family:var(--mono);font-size:11px;color:var(--text2);}
.views{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:20px;cursor:pointer;
  box-shadow:var(--shadow);transition:transform .18s,border-color .18s;display:flex;flex-direction:column;gap:12px;}
.card:hover{transform:translateY(-2px);border-color:rgba(57,139,255,.35);}
.card.read{opacity:.66;}
.card .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.tag{font-size:11px;font-weight:700;padding:4px 9px;border-radius:var(--r-tag);background:rgba(255,148,31,.12);color:var(--amber);}
.tag.new{background:rgba(53,240,106,.14);color:var(--green);}
.tag.min{background:rgba(245,196,0,.12);color:var(--yellow);font-family:var(--mono);font-weight:400;}
.tag.score{background:rgba(76,195,255,.12);color:var(--cyan);font-family:var(--mono);font-weight:400;}
.tag.done{background:rgba(53,240,106,.14);color:var(--green);}
.card h2{font-size:19px;font-weight:700;line-height:1.3;color:var(--text);}
.card .src{align-self:flex-start;font-family:var(--mono);font-size:11px;color:var(--text2);background:rgba(255,255,255,.05);padding:4px 9px;border-radius:var(--r-tag);}
.card .ex{font-size:15px;line-height:1.55;color:var(--text3);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.card .foot{display:flex;gap:10px;align-items:center;margin-top:auto;}
.act{width:46px;height:46px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border-radius:var(--r-icon);
  background:rgba(255,255,255,.06);border:1px solid var(--line2);color:var(--text2);cursor:pointer;transition:transform .15s,background .15s,color .15s,border-color .15s;}
.act svg{width:20px;height:20px;}
.act:active{transform:scale(.94);}
.act.rd.on{background:rgba(53,240,106,.16);border-color:rgba(53,240,106,.4);color:var(--green);}
.act.bm.on{background:rgba(255,148,31,.16);border-color:rgba(255,148,31,.4);color:var(--amber);}
.card .words{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--cyan);}
.empty{padding:60px 20px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-panel);}
.empty p{font-size:18px;font-weight:700;margin-bottom:8px;}
.empty span{color:var(--text2);font-size:13px;}
.overlay{position:fixed;inset:0;background:rgba(4,8,16,.66);z-index:60;display:none;}
.overlay.open{display:block;}
#sideOv{z-index:65;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);z-index:61;overflow:auto;padding:24px;
  background:rgba(13,22,36,.97);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .26s cubic-bezier(.22,.9,.3,1);}
.drawer.open{transform:none;}
.drawer h2{font-size:20px;font-weight:800;line-height:1.3;margin:12px 0;}
.drawer .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.block{background:rgba(255,255,255,.04);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:14px;padding:14px;margin-bottom:12px;}
.block h3{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan);margin-bottom:8px;}
.block p,.block li{font-size:13.5px;line-height:1.6;color:var(--text3);}
.block ol{padding-left:18px;}
.terms{display:flex;gap:6px;flex-wrap:wrap;}
.terms span{font-family:var(--mono);font-size:11px;color:var(--cyan);background:rgba(76,195,255,.1);padding:4px 9px;border-radius:var(--r-tag);}
.drawer textarea{width:100%;min-height:96px;background:var(--field);border:1px solid var(--line2);border-radius:14px;color:var(--text);font-family:var(--mono);font-size:12.5px;padding:12px;outline:none;}
.drawer textarea:focus{border-color:var(--accent);}
.drawer .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
.close{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:var(--r-icon);background:rgba(255,255,255,.06);border:1px solid var(--line2);color:var(--text);cursor:pointer;}
.pop{position:fixed;top:96px;right:20px;z-index:70;width:288px;padding:14px;display:none;
  background:rgba(13,22,36,.97);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);}
.pop.open{display:block;}
.pop .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:13px;color:var(--text2);}
.pop .row:last-child{border-bottom:none;}
.pop .row b{color:var(--text);font-weight:600;}
.sw{width:44px;height:26px;flex:0 0 auto;border-radius:var(--r-pill);background:rgba(255,255,255,.12);border:1px solid var(--line2);position:relative;cursor:pointer;transition:background .18s;}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:var(--r-pill);background:var(--text2);transition:transform .18s,background .18s;}
.sw.on{background:rgba(57,139,255,.5);}
.sw.on::after{transform:translateX(18px);background:#fff;}
.pop .hint{font-size:11px;line-height:1.5;color:var(--text2);padding:8px 4px 2px;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;display:none;align-items:center;gap:12px;max-width:92vw;
  padding:12px 16px;background:rgba(13,22,36,.96);border:1px solid rgba(57,139,255,.4);border-radius:14px;box-shadow:var(--shadow);font-size:13px;}
.toast.show{display:flex;}
.toast button{background:none;border:1px solid var(--amber);color:var(--amber);border-radius:10px;padding:5px 12px;font-size:12px;cursor:pointer;}
.tabbar{display:none;}
@media(max-width:1024px){
  .shell{grid-template-columns:1fr;}
  .sidebar{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:70;max-height:74vh;border-radius:22px 22px 0 0;
    transform:translateY(104%);transition:transform .28s cubic-bezier(.22,.9,.3,1);padding-bottom:calc(16px + env(safe-area-inset-bottom));}
  .sidebar.open{transform:none;}
}
@media(max-width:767px){
  .wrap{padding:10px 16px calc(100px + env(safe-area-inset-bottom));}
  .topbar{top:8px;height:60px;gap:8px;padding:0 12px;border-radius:18px;}
  .logo b{font-size:16px;}
  .logo svg{width:26px;height:26px;}
  select{display:none;}
  .btn{height:42px;padding:0 12px;font-size:12px;}
  .btn.icon{width:42px;}
  .searchwrap{height:42px;}
  .resume{height:auto;min-height:48px;flex-wrap:wrap;padding:8px 12px;gap:4px 0;}
  .resume .seg{padding:0 10px;height:32px;border-right:none;}
  .resume.collapsed .seg.hide-m{display:none;}
  #statsToggle{display:inline-flex;height:32px;padding:0 10px;font-size:11px;}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;position:sticky;top:74px;z-index:30;
    background:linear-gradient(180deg,rgba(8,13,22,.92),rgba(8,13,22,.75) 80%,transparent);scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:7px;height:42px;padding:0 14px;border-radius:13px;
    background:var(--panel2);border:1px solid var(--line);color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;}
  .chip .ic{width:17px;height:17px;color:var(--cyan);}
  .chip.active{background:linear-gradient(110deg,rgba(42,127,255,.35),rgba(28,83,160,.22));border-color:rgba(57,139,255,.4);color:var(--text);}
  .mainhead h1{font-size:19px;}
  .views{margin-left:0;width:100%;}
  .grid{grid-template-columns:1fr;gap:14px;}
  .card{padding:17px;border-radius:var(--r-card);}
  .card h2{font-size:17.5px;}
  .card .ex{font-size:14.5px;}
  .act{width:44px;height:44px;}
  .bg-photo{inset:-4%;background-image:url('/assets/background/accelerator-mobile.png'),url('/assets/background/accelerator-mobile.webp'),url('/assets/background/accelerator-mobile.jpg');background-position:50% 12%;opacity:.8;}
  #ring{right:-34%;top:-8%;width:124vmin;height:124vmin;opacity:.16;}
  .bg-scrim-h{background:linear-gradient(180deg,rgba(5,10,20,.40) 0%,rgba(5,10,20,.55) 45%,rgba(5,10,20,.92) 100%);}
  .bg-scrim-v{background:linear-gradient(180deg,rgba(5,10,20,.15),rgba(5,10,20,.35) 60%,rgba(5,10,20,.85));}
  .drawer{top:auto;left:0;right:0;bottom:0;width:100%;height:88vh;border-left:none;border-radius:22px 22px 0 0;transform:translateY(104%);padding-bottom:calc(24px + env(safe-area-inset-bottom));}
  .drawer.open{transform:none;}
  .pop{top:76px;right:12px;left:12px;width:auto;}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(68px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
    background:rgba(11,19,32,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);border-radius:22px 22px 0 0;}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:none;color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;}
  .tabbar button svg{width:21px;height:21px;}
  .tabbar button.on{color:var(--cyan);}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom));}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;}
  .bg-photo,#ring{transform:none!important;}
}
</style>
</head>
<body>
<div id="bg" aria-hidden="true">
  <div class="bg-base"></div>
  <div class="bg-photo" id="bgPhoto"></div>
  <svg id="ring" viewBox="0 0 600 600" fill="none">
    <circle cx="300" cy="300" r="282" stroke="#4CC3FF" stroke-width="2" stroke-dasharray="40 14" opacity=".8"/>
    <circle cx="300" cy="300" r="252" stroke="#398BFF" stroke-width="10" stroke-dasharray="180 60" opacity=".55"/>
    <circle cx="300" cy="300" r="214" stroke="#9AAABD" stroke-width="1.5" stroke-dasharray="6 10" opacity=".6"/>
    <circle cx="300" cy="300" r="168" stroke="#398BFF" stroke-width="6" stroke-dasharray="90 40" opacity=".45"/>
    <g stroke="#4CC3FF" stroke-width="1.5" opacity=".5">
      <path d="M300 18v564M18 300h564M100 100l400 400M500 100L100 500"/>
    </g>
    <g fill="#FF941F"><circle cx="300" cy="18" r="5"/><circle cx="582" cy="300" r="5"/><circle cx="300" cy="582" r="5"/><circle cx="18" cy="300" r="5"/></g>
  </svg>
  <div class="bg-glow"></div>
  <div class="bg-scrim-h"></div>
  <div class="bg-scrim-v"></div>
</div>

<div class="wrap">
  <header class="topbar">
    <a class="logo" href="/">
      <svg viewBox="0 0 32 32" fill="none"><path d="M6 24L14 8h5l-8 16H6z" fill="#398BFF"/><path d="M15 24L23 8h5l-8 16h-5z" fill="#4CC3FF"/><circle cx="27" cy="24" r="2.4" fill="#FF941F"/></svg>
      <b>ENGFEED</b>
    </a>
    <div class="searchwrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" placeholder="Поиск по всей ленте…" autocomplete="off">
    </div>
    <select id="sort" title="Сортировка">
      <option value="long">Длинные сначала</option>
      <option value="score">По качеству</option>
      <option value="title">По названию</option>
      <option value="source">По источнику</option>
    </select>
    <button class="btn primary" id="findMore">＋ Найти ещё</button>

function strip(h){ return String(h==null?'':h).replace(/<[^>]*>/g,''); }

function merge(s){
  if(!s) return false;
  var changed=false;
  ['read','bm'].forEach(function(k){ var src=s[k]||{}; Object.keys(src).forEach(function(u){ if(!state[k][u]||src[u]>state[k][u]){ state[k][u]=src[u]; changed=true; } }); });
  var sn=s.notes||{}; Object.keys(sn).forEach(function(u){ var a=state.notes[u], b=sn[u]; if(b&&(!a||(b.ts||0)>(a.ts||0))){ state.notes[u]=b; changed=true; } });
  var se=s.extra||{}; Object.keys(se).forEach(function(cid){ var arr=state.extra[cid]||[]; var seen={}; arr.forEach(function(it){ seen[it.url||it.title]=1; }); (se[cid]||[]).forEach(function(it){ var k=it.url||it.title; if(!seen[k]&&okExtra(it)){ seen[k]=1; arr.push(it); changed=true; } }); state.extra[cid]=arr; });
  var su=s.updated||{}; Object.keys(su).forEach(function(cid){ if(!state.updated[cid]||su[cid]>state.updated[cid]){ state.updated[cid]=su[cid]; changed=true; } });
  var snw=s.newUrls||{}; Object.keys(snw).forEach(function(u){ if(!state.newUrls[u]){ state.newUrls[u]=snw[u]; changed=true; } });
  if(s.prefs&&(s.prefs.ts||0)>state.prefsTs){ state.cat=s.prefs.cat||state.cat; state.view=s.prefs.view||state.view; state.sort=s.prefs.sort||state.sort; if(typeof s.prefs.auto==='boolean') state.auto=s.prefs.auto; if(typeof s.prefs.eco==='boolean') state.eco=s.prefs.eco; if(typeof s.prefs.calm==='boolean') state.calm=s.prefs.calm; state.prefsTs=s.prefs.ts; changed=true; }
  if(s.lastVisit&&(!state.lastVisit||s.lastVisit>state.lastVisit)) state.lastVisit=s.lastVisit;
  if(changed) saveAllLocal();
  return changed;
}

function itemsFor(cat){
  var base=cat.seed.map(function(t){ return {title:t,url:wikiUrl(t),source:'Википедия',minutes:minutes(t),excerpt:'',_cat:cat.id}; });
  var ex=(state.extra[cat.id]||[]).filter(okExtra).map(function(it){ it._cat=cat.id; return it; });
  var seen={}, out=[];
  base.concat(ex).forEach(function(it){ var k=it.url||it.title; if(!seen[k]){ seen[k]=1; out.push(it); } });
  return out;
}
function catById(id){ for(var i=0;i<CATS.length;i++) if(CATS[i].id===id) return CATS[i]; return CATS[0]; }
function currentCat(){ return catById(state.cat); }
function filtered(){
  var list;
  if(state.q){ list=[]; CATS.forEach(function(c){ list=list.concat(itemsFor(c)); }); }
  else list=itemsFor(currentCat());
  var q=state.q.toLowerCase();
  if(q) list=list.filter(function(it){ return (it.title+' '+it.source+' '+(it.excerpt||'')).toLowerCase().indexOf(q)>=0; });
  if(state.view==='unread') list=list.filter(function(it){ return !state.read[it.url]; });
  if(state.view==='bm') list=list.filter(function(it){ return state.bm[it.url]; });
  if(state.view==='long') list=list.filter(function(it){ return it.minutes>=15; });
  if(state.sort==='long') list.sort(function(a,b){ return b.minutes-a.minutes; });
  else if(state.sort==='score') list.sort(function(a,b){ return (b.score||0)-(a.score||0); });
  else if(state.sort==='title') list.sort(function(a,b){ return a.title.localeCompare(b.title,'ru'); });
  else list.sort(function(a,b){ return a.source.localeCompare(b.source,'ru'); });
  return list;
}

    var all=itemsFor(c), rd=all.filter(function(it){ return state.read[it.url]; }).length;

    var pct=all.length?Math.round(100*rd/all.length):0;
    h+='<button class="cat'+(c.id===state.cat?' active':'')+'" data-cat="'+c.id+'">'+icon(c.id)+'<span class="nm">'+esc(c.name)+'</span><span class="cnt">'+(nw?'+'+nw+' · ':'')+all.length+'</span><span class="bar"><i style="width:'+pct+'%"></i></span></button>';

  var out=[], jobs=[];
  jobs.push(fetch('https://ru.wikipedia.org/w/rest.php/v1/search/page?q='+encodeURIComponent(cat.query)+'&limit=20')
    .then(function(r){ return r.json(); }).then(function(j){ (j.pages||[]).forEach(function(p){ out.push({title:p.title,url:'https://ru.wikipedia.org/wiki/'+encodeURIComponent(p.key),source:'Википедия',minutes:10+(p.title.length%10),excerpt:p.description||''}); }); }).catch(function(){}));
  jobs.push(fetch('https://ru.wikipedia.org/w/api.php?action=query&list=search&srsearch='+encodeURIComponent(cat.query)+'&srlimit=20&format=json&origin=*')
    .then(function(r){ return r.json(); }).then(function(j){ ((j.query&&j.query.search)||[]).forEach(function(p){ out.push({title:p.title,url:wikiUrl(p.title),source:'Википедия',minutes:12+(p.title.length%9),excerpt:strip(p.snippet)}); }); }).catch(function(){}));
  return Promise.all(jobs).then(function(){ return out; });
}
function liveSearch(cat){
  return fetch('/api/search?cat='+encodeURIComponent(cat.id)+'&force=1')
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(j){
      if(j&&j.items&&j.items.length){
        return j.items.filter(okExtra).map(function(it){ return {title:it.title,url:it.url,source:it.source,minutes:it.minutes,excerpt:it.excerpt,score:it.score,length:it.length}; });
      }
      return wikiFallback(cat);
    })
    .catch(function(){ return wikiFallback(cat); });
}
function refresh(catId,silent){
  if(refreshing) return;
  refreshing=true;
  var cat=catById(catId);
  var btn=document.getElementById('findMore');
  if(!silent){ btn.disabled=true; btn.textContent='Ищу…'; }
  liveSearch(cat).then(function(found){
    var ex=state.extra[cat.id]||[];
    var seen={}; itemsFor(cat).forEach(function(it){ seen[it.url||it.title]=1; });
    var added=0, now=Date.now();
    found.forEach(function(it){ var k=it.url||it.title; if(!seen[k]&&it.minutes>=8&&okExtra(it)){ seen[k]=1; it.added=now; ex.push(it); state.newUrls[k]=now; added++; } });
    state.extra[cat.id]=ex; state.updated[cat.id]=now;
    save('extra',state.extra); save('updated',state.updated); save('newUrls',state.newUrls);
    renderAll();
    refreshing=false;
    if(!silent){ btn.disabled=false; btn.textContent='＋ Найти ещё'; toast(added?('Добавлено проверенных статей: '+added+' (всего '+itemsFor(cat).length+')'):'Новых качественных материалов не найдено — библиотека актуальна'); }
    else if(added) toast('Автообновление «'+cat.name+'»: +'+added+' новых');
  }).catch(function(){ refreshing=false; if(!silent){ btn.disabled=false; btn.textContent='＋ Найти ещё'; } });
}

var photo=document.getElementById('bgPhoto'), ring=document.getElementById('ring');
var sy=0, cur=0, ringCur=0, raf=0;
function applyModes(){
  document.body.classList.toggle('eco',!!state.eco);
  document.body.classList.toggle('calm',!!state.calm);
  document.getElementById('ecoToggle').className='sw'+(state.eco?' on':'');
  document.getElementById('calmToggle').className='sw'+(state.calm?' on':'');
  if(state.eco||state.calm){ photo.style.transform=''; ring.style.transform=''; cur=0; ringCur=0; }
}
function tick(){
  raf=0;
  if(state.eco||state.calm||document.hidden) return;
  cur+=(sy-cur)*.12;
  var target=Math.max(-18,Math.min(18,sy*0.025));
  ringCur+=(target-ringCur)*.12;
  photo.style.transform='translate3d(0,'+(-cur*0.04).toFixed(2)+'px,0) scale(1.06)';
  ring.style.transform='rotate('+ringCur.toFixed(2)+'deg)';
  if(Math.abs(sy-cur)>.5||Math.abs(target-ringCur)>.05) raf=requestAnimationFrame(tick);
}
addEventListener('scroll',function(){ sy=window.scrollY||0; if(!raf&&!state.eco&&!state.calm) raf=requestAnimationFrame(tick); },{passive:true});

document.getElementById('findMore').onclick=function(){ refresh(state.cat,false); };
document.getElementById('autoBtn').onclick=function(){ state.auto=!state.auto; state.prefsTs=Date.now(); save('auto',state.auto); save('prefsTs',state.prefsTs); renderHead(); toast(state.auto?'Автообновление включено (каждые 10 мин)':'Автообновление выключено'); };
setInterval(function(){ if(state.auto&&!document.hidden) refresh(state.cat,true); },600000);
document.getElementById('ecoToggle').onclick=function(){ state.eco=!state.eco; state.prefsTs=Date.now(); save('eco',state.eco); save('prefsTs',state.prefsTs); applyModes(); toast(state.eco?'Экономичный режим включён':'Экономичный режим выключен'); };
document.getElementById('calmToggle').onclick=function(){ state.calm=!state.calm; state.prefsTs=Date.now(); save('calm',state.calm); save('prefsTs',state.prefsTs); applyModes(); toast(state.calm?'Анимации отключены':'Анимации включены'); };
document.getElementById('profileBtn').onclick=function(e){ e.stopPropagation(); document.getElementById('profilePop').classList.toggle('open'); };
document.addEventListener('click',function(e){ if(!e.target.closest('#profilePop')&&!e.target.closest('#profileBtn')) document.getElementById('profilePop').classList.remove('open'); });

function selectCat(id){ state.cat=id; state.prefsTs=Date.now(); save('cat',state.cat); save('prefsTs',state.prefsTs); closeCats(); setTab('feed'); renderAll(); if(state.auto&&(!state.updated[state.cat]||Date.now()-state.updated[state.cat]>21600000)) refresh(state.cat,true); }
document.getElementById('cats').addEventListener('click',function(e){ var b=e.target.closest('.cat'); if(b) selectCat(b.dataset.cat); });
document.getElementById('chips').addEventListener('click',function(e){ var b=e.target.closest('.chip'); if(b) selectCat(b.dataset.cat); });
document.getElementById('views').addEventListener('click',function(e){ var b=e.target.closest('[data-view]'); if(!b) return; state.view=b.dataset.view; state.prefsTs=Date.now(); save('view',state.view); save('prefsTs',state.prefsTs); renderViews(); renderGrid(); setTab(state.view==='bm'?'bm':'feed'); });
document.getElementById('sort').addEventListener('change',function(e){ state.sort=e.target.value; state.prefsTs=Date.now(); save('sort',state.sort); save('prefsTs',state.prefsTs); renderGrid(); });
document.getElementById('q').addEventListener('input',function(e){ state.q=e.target.value; renderHead(); renderGrid(); });
document.getElementById('grid').addEventListener('click',function(e){
  var card=e.target.closest('.card'); if(!card) return;
  var url=card.dataset.url, cid=card.dataset.cat;
  var act=e.target.closest('[data-act]');
  if(act){ e.stopPropagation(); if(act.dataset.act==='read') toggleRead(url); else toggleBm(url); renderAll(); return; }
  var it=itemsFor(catById(cid)).filter(function(x){ return x.url===url; })[0];
  if(it) openDrawer(it);
});
document.getElementById('tabbar').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  var t=b.dataset.tab;
  if(t==='cats'){ if(document.getElementById('sidebar').classList.contains('open')){ closeCats(); setTab(state.view==='bm'?'bm':'feed'); } else { openCats(); setTab('cats'); } return; }
  closeCats();
  if(t==='feed'){ state.view='all'; state.prefsTs=Date.now(); save('view',state.view); save('prefsTs',state.prefsTs); renderViews(); renderGrid(); setTab('feed'); }
  else if(t==='bm'){ state.view='bm'; state.prefsTs=Date.now(); save('view',state.view); save('prefsTs',state.prefsTs); renderViews(); renderGrid(); setTab('bm'); }
  else if(t==='search'){ setTab('search'); window.scrollTo({top:0,behavior:'smooth'}); document.getElementById('q').focus(); }
});
document.getElementById('sideOv').onclick=function(){ closeCats(); setTab(state.view==='bm'?'bm':'feed'); };
document.getElementById('drClose').onclick=closeDrawer;
document.getElementById('ov').onclick=closeDrawer;
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ closeDrawer(); closeCats(); document.getElementById('profilePop').classList.remove('open'); } if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); document.getElementById('q').focus(); } });
window.addEventListener('focus',syncPull);
document.addEventListener('visibilitychange',function(){ if(!document.hidden){ syncPull(); if(state.auto&&(!state.updated[state.cat]||Date.now()-state.updated[state.cat]>21600000)) refresh(state.cat,true); } });

document.getElementById('sort').value=state.sort;
state.lastVisit=Date.now(); save('lastVisit',state.lastVisit);
applyModes();
renderAll();
syncPull();
if(removed>0) toast('Очищено мусорных записей: '+removed);
if(state.auto&&(!state.updated[state.cat]||Date.now()-state.updated[state.cat]>21600000)) refresh(state.cat,true);
if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js').catch(function(){}); }
})();
</script>
</body>
